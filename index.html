function openDataCheck(){
  const a=dataAnomalies();
  const dg=dupGroups(a.dup), cg=dupGroups(a.conflict);
  const block=(title,note,rows)=> rows.length ? `<p class="text-[11px] font-bold tracking-widest text-mute mt-4 mb-1.5">${title}</p>
      <p class="text-[11px] text-mute mb-2 leading-snug">${note}</p>
      <div class="space-y-2">${rows.join('')}</div>` : '';
  const body = a.total===0
    ? `<div class="chip rounded-xl p-4 text-center text-sm text-mute">No anomalies found. Every set is numbered the way it should be.</div>`
    : block('DUPLICATED SETS',
        'These sets were saved to your Sheet more than once, with identical numbers. They double that session&rsquo;s totals. Safe to remove.',
        dg.map(d=>findingRow(d.workoutId, `${d.exercise} — ${fmtDateShort(d.date)}`,
          `sets ${d.sets.sort((x,y)=>x-y).join(', ')} each logged ${d.copies}× · ${d.reps||0} reps`)))
    + block('DUPLICATES THAT DISAGREE',
        'Logged twice under the same set number but with different numbers — open these and check which one is right.',
        cg.map(d=>findingRow(d.workoutId, `${d.exercise} — ${fmtDateShort(d.date)}`,
          `set ${d.setNumber} has ${d.copies} conflicting versions`)))
    + block('UNUSUALLY HIGH SESSIONS',
        'Far above your normal for that movement. Often a knock-on effect of the duplicates above.',
        a.outliers.map(o=>findingRow(o.workoutId, `${o.exercise} — ${fmtDateShort(o.date)}`,
          `${o.reps} reps vs your usual ${o.median}`)))
    + block('LEFT UNFINISHED',
        'Started but never finished, so they never counted toward anything.',
        a.stuck.map(o=>findingRow(o.workoutId, o.name, `${fmtDateShort(o.date)} · open for ${o.age} days`)));
  modal(`<div class="p-5">
    <h3 class="font-display font-700 text-xl">Data check</h3>
    <p class="text-mute text-sm mt-1 leading-snug">Looks for records that came from a saving glitch rather than a real workout.</p>
    <div class="mt-2 max-h-[52vh] overflow-y-auto">${body}</div>
    <div class="grid ${dg.length?'grid-cols-2':'grid-cols-1'} gap-3 mt-5">
      <button onclick="closeModal()" class="rounded-xl py-3 chip font-semibold btn-press">Close</button>
      ${ dg.length ? `<button onclick="repairDuplicates()" class="rounded-xl py-3 font-bold text-ink btn-press" style="background:var(--volt)">Remove duplicates</button>`:'' }
    </div>
  </div>`);
}
/* Removes only EXACT duplicate copies (same set number, weight, reps and tick),
   renumbers what is left, and re-saves those workouts to the Sheet. */
function repairDuplicates(){
  const a=dataAnomalies();
  const ids=[...new Set(a.dup.map(d=>d.workoutId))];
  if(!ids.length){ toast('Nothing to repair'); return; }
  let removed=0;
  ids.forEach(id=>{
    const w=state.workouts.find(x=>x.workoutId===id); if(!w) return;
    (w.exercises||[]).forEach(e=>{
      const seen={}, keep=[];
      (e.sets||[]).forEach(s=>{
        const key=[s.setNumber, s.weight, s.reps, !!s.completed].join('|');
        if(seen[key]){ removed++; return; }
        seen[key]=1; keep.push(s);
      });
      e.sets=keep.map((s,i)=>Object.assign({}, s, {setNumber:i+1}));
    });
    w.updatedAt=Date.now();
    queueSaveWorkout(w);
  });
  flushSaves(); clearBestCache(); closeModal(); render();
  toast('Removed '+removed+' duplicate set'+(removed===1?'':'s'));
}
/* Shown on an exercise page whose records are implicated, because that is where
   an impossible number actually gets noticed. */
function exAnomalyBanner(name){
  const k=(name||'').toLowerCase(), a=dataAnomalies();
  const hit = a.dup.concat(a.conflict).filter(d=>d.exercise.toLowerCase()===k).length
            + a.outliers.filter(d=>d.exercise.toLowerCase()===k).length;
  if(!hit) return '';
  return `<div class="px-5 mt-4">
    <button onclick="openDataCheck()" class="w-full card p-3.5 text-left btn-press edge-ring flex items-center gap-3">
      <svg class="w-5 h-5 shrink-0 edge-text" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v4m0 4h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg>
      <span class="min-w-0">
        <span class="block font-display font-600 text-sm">${hit} record${hit===1?'':'s'} here may not be real</span>
        <span class="block text-[11px] text-mute">Sets saved more than once inflate these totals. Tap to review.</span>
      </span>
    </button>
  </div>`;
}

    <label class="text-xs font-bold tracking-widest text-mute">BODY WEIGHT (${state.unit.toUpperCase()})</label>
    <input id="setBw" type="number" inputmode="decimal" value="${esc(state.bodyWeight)}" placeholder="${BW_DEFAULT}" class="field w-full p-3 text-base mt-1.5 mb-1"/>
    <p class="text-[11px] text-mute mb-4">Push-ups, chin-ups, planks and crunches move your body, not a dumbbell — so they used to score zero. Now they count the share of your body weight each movement lifts, which is what makes them show up in your totals, charts and milestones. Until you set this we assume ${BW_DEFAULT} ${state.unit}.</p>

    <div class="flex items-center justify-between text-xs text-mute mb-4">
      <span>Status</span>
      <span>${ state.gas ? '<b class="text-white">Connected (hosted)</b>' : (state.apiUrl ? (state.online?'<b class="text-white">Connected</b>':'<b class="edge-text">Not reachable</b>') : '<b>Device-only</b>') }</span>
    </div>

    <button onclick="openDataCheck()" class="w-full flex items-center justify-between chip rounded-xl px-3 py-3 mb-3 btn-press">
      <span class="text-sm font-semibold">Check my data</span>
      <span class="text-[11px] font-bold ${_anomCount()?'edge-text':'text-mute'}">${_anomCount()? _anomCount()+' to review' : 'All clear'}</span>
    </button>

    <div class="grid grid-cols-2 gap-3">
      <button onclick="closeModal()" class="rounded-xl py-3 chip font-semibold btn-press">Close</button>
      <button onclick="saveSettings()" class="rounded-xl py-3 font-bold text-ink btn-press" style="background:var(--volt)">Save & Sync</button>
    </div>
    <button onclick="reloadFromCloud()" class="w-full text-center text-xs text-mute mt-3 btn-press py-1">↻ Reload from cloud</button>
  </div>`);
}
function setUnit(u){
  state.unit=u; Store.set(KEY.unit,u); cacheSave();
  const kg=$('#unitKg'), lbs=$('#unitLbs');
  if(kg){ kg.className=`rounded-xl py-3 font-display font-700 btn-press ${u==='kg'?'text-ink':'chip text-mute'}`; kg.style.background=u==='kg'?'var(--volt)':''; }
  if(lbs){ lbs.className=`rounded-xl py-3 font-display font-700 btn-press ${u==='lbs'?'text-ink':'chip text-mute'}`; lbs.style.background=u==='lbs'?'var(--volt)':''; }
  // persist the preference only — never reloads, so it can't touch your days/workouts
  if(state.apiUrl||state.gas) apiPost('saveSettings',{settings:{unit:u}}).catch(()=>{});
}
async function saveSettings(){
  const el=$('#setUrl');
  if(el){ state.apiUrl=el.value.trim(); Store.set(KEY.url,state.apiUrl); }
  const bw=$('#setBw');
  if(bw){ const v=num(bw.value); state.bodyWeight = v>0 ? String(v) : ''; Store.set(KEY.bw, state.bodyWeight); }
  cacheSave();
  closeModal(); toast('Settings saved'); render();
  if(state.apiUrl || state.gas){
    try{ await apiPost('saveSettings',{ settings:{ unit:state.unit, bodyWeight:state.bodyWeight||'' } }); }catch(e){}
    reloadFromCloud(true);
  }
}
async function reloadFromCloud(silent){
  if(!state.apiUrl && !state.gas){ if(!silent) toast('No URL set','err'); return; }
  try{
    const data=await apiGet();
    applyCloud(data);
    render(); if(!silent) toast('Synced');
  }catch(e){ state.online=false; if(!silent) toast('Could not reach cloud','err'); render(); }
}

/* ---------- go ---------- */
boot();
</script>
</body>
</html>
