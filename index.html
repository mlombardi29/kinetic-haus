<head>

<title>Kinetic Haus — Train</title>

<!-- ============================================================= -->
<!--  KINETIC HAUS — Single-file workout tracker                   -->
<!--  Tech: HTML + Tailwind (CDN) + vanilla JS + Chart.js (CDN)    -->
<!--  Backend: Google Apps Script Web App -> Google Sheet          -->
<!--                                                               -->
<!--  SETUP (non-developer friendly): see SETUP.md in this folder. -->
<!--  Quick version:                                               -->
<!--   1. Create a Google Sheet.                                   -->
<!--   2. Extensions > Apps Script, paste Code.gs, Deploy as Web   -->
<!--      App (Execute as: Me, Who has access: Anyone).            -->
<!--   3. Copy the Web App URL.                                    -->
<!--   4. Open this app, tap the gear (top-right) and paste the    -->
<!--      URL. Done. Data lives in your Sheet.                     -->
<!--                                                               -->
<!--  Works offline / in sandboxes too: if no URL is set (or the   -->
<!--  network/localStorage is blocked) the app keeps everything in -->
<!--  memory + localStorage and never crashes.                     -->
<!-- ============================================================= -->

<script src="https://cdn.tailwindcss.com"></script>

<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          ink:      '#0a0a0b',   // page background (near black)
          panel:    '#141417',   // raised surfaces
          panel2:   '#1c1c21',   // deeper surfaces / inputs
          line:     '#2a2a31',   // borders
          mute:     '#8b8b96',   // muted text
          volt:     '#ffffff',   // primary "fill" accent — monochrome white
          edge:     '#d8ff4f',   // yellow — OUTLINE / STROKE USE ONLY (never a fill)
        },
        fontFamily: {
          display: ['"Chakra Petch"', 'system-ui', 'sans-serif'],
          sans:    ['Inter', 'system-ui', 'sans-serif'],
        },
        // register numeric weight utilities (font-400 … font-800) used throughout
        fontWeight: { 400:'400', 500:'500', 600:'600', 700:'700', 800:'800' },
      }
    }
  }
</script>

<style>
  /* MONOCHROME brand palette. --volt = white primary fill. --edge = yellow,
     used ONLY as an outline/stroke (focus rings, in-progress border, PR markers,
     chart lines, earned-badge ring) — never as a filled background or text. */
  :root { --volt:#ffffff; --edge:#d8ff4f; }
  html,body{background:#0a0a0b;}
  body{ -webkit-tap-highlight-color:transparent; font-family:Inter,system-ui,sans-serif; color:#f4f4f6; overscroll-behavior-y:none; }
  *{ -webkit-touch-callout:none; }
  ::-webkit-scrollbar{ width:0; height:0; }
  input,select,textarea{ font-size:16px; } /* prevent iOS zoom */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; }

  .safe-bottom{ padding-bottom:calc(env(safe-area-inset-bottom) + 86px); }
  .nav-safe{ padding-bottom:env(safe-area-inset-bottom); }

  .glass{ background:rgba(20,20,23,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .card{ background:linear-gradient(160deg,#17171b 0%,#101012 100%); border:1px solid #24242b; border-radius:20px; }
  .btn-press{ transition:transform .08s ease, background .15s ease, border-color .15s ease; }
  .btn-press:active{ transform:scale(.97); }

  .volt-glow{ box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 10px 34px -10px rgba(255,255,255,.22); }
  .accent-text{ color:#ffffff; }
  .edge-ring{ box-shadow:0 0 0 1.5px var(--edge); border-color:var(--edge)!important; }
  .edge-text{ color:var(--edge); }

  /* view transitions — opacity only (no transform) so fixed children stay
     anchored to the viewport, not to the animated wrapper */
  .view{ animation:viewfade .25s ease both; }
  @keyframes viewfade{ from{opacity:0;} to{opacity:1;} }
  @keyframes fade{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  .pulse-dot{ animation:pulse 1.6s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  /* completed set row (white-tinted, no colour) */
  .set-done{ background:linear-gradient(90deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); border-color:rgba(255,255,255,.38)!important; }

  .chip{ background:#1c1c21; border:1px solid #2a2a31; }
  .field{ background:#1c1c21; border:1px solid #2a2a31; border-radius:14px; }
  .field:focus-within{ border-color:var(--edge); box-shadow:0 0 0 1px var(--edge); }
  textarea.field, input.field, select.field{ outline:none; }

  .toast-in{ animation:toastIn .25s ease both; }
  @keyframes toastIn{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;} }

  .modal-back{ animation:fade .2s ease both; }
  .sheet{ animation:sheetUp .3s cubic-bezier(.22,1,.36,1) both; }
  @keyframes sheetUp{ from{transform:translateY(100%);} to{transform:none;} }

  .hidden-imp{ display:none!important; }
  .spin{ animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
</style>

<script>
/* =================================================================
   KINETIC HAUS  —  app logic
   ================================================================= */

/* ---------- Brand logo ----------------------------------------------------
   The official Kinetic Haus mark: interlocking K+H monogram + dot + wordmark.
   Reproduced here as a white inline SVG so the app stays a single self-contained
   file and the logo scales crisply on any background.

   ► To drop in your EXACT official artwork instead, paste a data-URI (or URL)
     of the white/transparent logo into KH_LOGO_OVERRIDE below — the app will
     use that image verbatim and skip the inline SVG. Nothing else changes. */
const KH_LOGO_OVERRIDE = ''; // e.g. 'data:image/svg+xml;base64,....' or 'assets/logo.svg'

function MONOGRAM(size, color){
  color = color || '#ffffff';
  return `<svg viewBox="0 0 120 200" width="${size}" height="${size*200/120}" fill="${color}" aria-label="Kinetic Haus monogram">
    <path d="M6 8c10 0 14 6 14 16v48c0 12 8 18 18 18v14c-10 0-18 6-18 18v48c0 10-4 16-14 16-2 0-4 0-6-.5v-13c5 0 7-3 7-8v-50c0-12 6-19 15-22-9-3-15-10-15-22V29.5c0-5-2-8-7-8V8.5C2 8 4 8 6 8z"/>
    <rect x="38" y="6" width="13" height="188" rx="6"/>
    <path d="M51 96c14-2 24-12 30-30 3-9 5-18 5-30h13c0 16-3 28-8 40-5 12-13 21-24 26v-6z"/>
    <rect x="69" y="6" width="13" height="188" rx="6"/>
    <rect x="44" y="92" width="44" height="13" rx="5"/>
    <path d="M114 8c-10 0-14 6-14 16v48c0 12-8 18-18 18v14c10 0 18 6 18 18v48c0 10 4 16 14 16 2 0 4 0 6-.5v-13c-5 0-7-3-7-8v-50c0-12-6-19-15-22 9-3 15-10 15-22V29.5c0-5 2-8 7-8V8.5c-2-.5-4-.5-6-.5z"/>
  </svg>`;
}
/* Full horizontal lockup: monogram · KINETIC / HAUS */
function LOGO_LOCKUP(){
  const mark = KH_LOGO_OVERRIDE
    ? `<img src="${KH_LOGO_OVERRIDE}" alt="Kinetic Haus" class="h-9 w-auto"/>`
    : `<div class="flex items-center gap-2.5">
        <div class="w-8 shrink-0">${MONOGRAM(30)}</div>
        <span class="w-1.5 h-1.5 rounded-full bg-white shrink-0"></span>
        <div class="leading-[0.9] font-display font-700 tracking-[.16em] text-white">
          <div class="text-[14px]">KINETIC</div>
          <div class="text-[14px]">HAUS</div>
        </div>
      </div>`;
  return mark;
}
function WORDMARK(){ return LOGO_LOCKUP(); }

/* ---------- Built-in exercise library -------------------------------------
   ~250 of the most common gym + at-home movements, with multiple variations
   where it makes sense (e.g. Bench Press / Incline / Decline / Smith Machine).
   These power the autocomplete in "Add exercise". They live in the background:
   only matching ones surface as you type. Anything you type that isn't here is
   remembered (state.customEx) and suggested next time. */
const EXERCISE_LIB = [
  // ---- Chest ----
  'Bench Press','Incline Bench Press','Decline Bench Press','Close-Grip Bench Press','Smith Machine Bench Press',
  'Dumbbell Press','Incline Dumbbell Press','Decline Dumbbell Press',
  'Dumbbell Flies','Incline Dumbbell Flies','Decline Dumbbell Flies',
  'Cable Fly','Low Cable Fly','High Cable Fly','Pec Deck','Chest Press Machine',
  'Push-Ups','Incline Push-Ups','Decline Push-Ups','Diamond Push-Ups','Wide Push-Ups','Knee Push-Ups','Plyometric Push-Ups',
  'Chest Dips','Svend Press',
  // ---- Back ----
  'Deadlift','Romanian Deadlifts','Sumo Deadlift','Trap Bar Deadlift','Stiff-Leg Deadlift','Single-Leg Deadlift','Deficit Deadlift',
  'Pull-Ups','Wide-Grip Pull-Ups','Neutral-Grip Pull-Ups','Assisted Pull-Ups','Weighted Pull-Ups',
  'Chin-Ups','Assisted Chin-Ups','Weighted Chin-Ups',
  'Lat Pulldown','Wide-Grip Lat Pulldown','Close-Grip Lat Pulldown','Behind-Neck Lat Pulldown',
  'Bent-Over Row','Barbell Row','Dumbbell Row','One-Arm Dumbbell Rows','Pendlay Row','T-Bar Row','Meadows Row',
  'Seated Cable Row','Wide-Grip Seated Row','Inverted Row','Chest-Supported Row','Machine Row',
  'Face Pull','Straight-Arm Pulldown','Reverse Flies','Cable Reverse Fly','Rear Delt Machine Fly',
  'Shrugs','Dumbbell Shrugs','Barbell Shrugs','Back Extension','Good Morning','Superman',
  // ---- Shoulders ----
  'Overhead Press','Barbell Overhead Press','Dumbbell Shoulder Press','Seated Shoulder Press','Shoulder Press','Machine Shoulder Press',
  'Arnold Presses','Push Press','Landmine Press','Lateral Raises','Cable Lateral Raise','Machine Lateral Raise',
  'Front Raise','Cable Front Raise','Rear Delt Fly','Upright Row','Plate Front Raise',
  // ---- Biceps ----
  'Bicep Curls','Dumbbell Curl','Barbell Curl','Cable Curl','Hammer Curls','Dumbbell Concentration Curls','Preacher Curl',
  'Incline Dumbbell Curl','EZ-Bar Curl','Spider Curl','Zottman Curl','Reverse Curl',
  // ---- Triceps ----
  'Tricep Pushdown','Rope Pushdown','Bar Pushdown','Tricep Kickbacks','Overhead Tricep Extension',
  'Cable Overhead Extension','Dumbbell Overhead Extension','Skull Crushers','Tricep Dips','Bench Dips','Incline Tricep Dips','JM Press',
  // ---- Quads / Legs ----
  'Squats','Back Squat','Front Squat','Goblet Squat','Smith Machine Squat','Hack Squat','Bulgarian Split Squat',
  'Split Squat','Sumo Squat','Box Squat','Pistol Squat','Sissy Squat','Jump Squat',
  'Leg Presses','Single-Leg Press','Lunges','Walking Lunges','Reverse Lunges','Side Lunges','Curtsy Lunges',
  'Leg Extension','Step-Ups','Wall Sit',
  // ---- Hamstrings / Glutes ----
  'Leg Curl','Seated Leg Curl','Lying Leg Curl','Hip Thrust','Barbell Hip Thrust','Single-Leg Hip Thrust',
  'Glute Bridge','Cable Pull-Through','Kettlebell Swing','Nordic Curl','Glute Kickback','Hip Abduction','Hip Adduction',
  // ---- Calves ----
  'Standing Calf Raise','Seated Calf Raise','Single-Leg Calf Raise','Calf Press',
  // ---- Core ----
  'Plank','Side Planks','Plank with Shoulder Taps','Up-Down Plank','Weighted Plank',
  'Crunch','Cable Crunch','Bicycle Crunch','Reverse Crunch','Sit-Ups','Decline Sit-Ups',
  'Leg Raises','Hanging Leg Raise','Lying Leg Raise','Hanging Knee Raise','Russian Twists',
  'Mountain Climbers','Hollow Hold','Dead Bug','Ab Wheel Rollout','Flutter Kicks','V-Ups','Toe Touches',
  'Cable Woodchopper','Pallof Press','Bird Dog','Dragon Flag','Sit-Up Throws',
  // ---- Olympic / Power / Functional ----
  'Power Clean','Hang Clean','Clean and Jerk','Snatch','Dumbbell Snatch','Thruster','Push Jerk',
  'Turkish Get-Up','Kettlebell Clean','Kettlebell Snatch','Wall Ball','Medicine Ball Slam','Devil Press','Man Maker',
  // ---- Conditioning / Movement ----
  'Burpees','Box Jumps','Jumping Jacks','High Knees','Skater Jumps','Battle Ropes','Sled Push','Sled Pull',
  'Farmer’s Carry','Bear Crawl','Tire Flip','Sledgehammer Swing','Jump Rope','Box Step-Overs',
  // ---- Cardio ----
  'Running','Treadmill Run','Sprints','Incline Walk','Rowing (Erg)','Ski Erg','Cycling','Stationary Bike',
  'Assault Bike','Stair Climber','Elliptical','Swimming',
  // ---- Mobility / Stretch ----
  'Hip Flexor Stretch','Hamstring Stretch','Pigeon Pose','Cat-Cow','World’s Greatest Stretch',
  'Foam Rolling','Couch Stretch','Thread the Needle','Childs Pose','Downward Dog',
];

/* Frequency map of how often each exercise has been used (from logged workouts +
   the day templates) so the most-used names float to the top of suggestions. */
function exerciseFreq(){
  const f={};
  const bump=(n,by)=>{ const k=n.toLowerCase(); f[k]=(f[k]||0)+by; };
  state.workouts.forEach(w=>(w.exercises||[]).forEach(e=>bump(e.name,2)));
  if(state.active) state.active.exercises.forEach(e=>bump(e.name,2));
  Object.values(state.days).forEach(d=>d.exercises.forEach(e=>bump(e.name,1)));
  return f;
}
/* Master de-duplicated list: library ∪ custom ∪ history ∪ templates. */
function allKnownExercises(){
  const seen=new Set(), out=[];
  const add=n=>{ const k=n.toLowerCase(); if(k && !seen.has(k)){ seen.add(k); out.push(n); } };
  state.customEx.forEach(add);
  state.workouts.forEach(w=>(w.exercises||[]).forEach(e=>add(e.name)));
  Object.values(state.days).forEach(d=>d.exercises.forEach(e=>add(e.name)));
  EXERCISE_LIB.forEach(add);
  return out;
}
function isKnownExercise(name){
  const k=name.trim().toLowerCase();
  return allKnownExercises().some(n=>n.toLowerCase()===k);
}
/* Ranked suggestions for a query. Empty query => most-used first. */
function suggestExercises(query, limit=40){
  const q=(query||'').trim().toLowerCase();
  const freq=exerciseFreq();
  let list=allKnownExercises();
  if(q) list=list.filter(n=>n.toLowerCase().includes(q));
  list.sort((a,b)=>{
    const fa=freq[a.toLowerCase()]||0, fb=freq[b.toLowerCase()]||0;
    if(fb!==fa) return fb-fa;                                   // most used first
    if(q){ const sa=a.toLowerCase().startsWith(q)?0:1, sb=b.toLowerCase().startsWith(q)?0:1; if(sa!==sb) return sa-sb; }
    return a.localeCompare(b);
  });
  return list.slice(0,limit);
}

/* ---------- exercise type: weighted | bodyweight | timed --------------------
   Decides which inputs to show. Explicit equipment words force 'weighted'
   (e.g. "Weighted Pull-Ups", "Dumbbell Lunges"). Static holds & cardio are
   'timed' (seconds). Calisthenics are 'bodyweight' (reps only, no weight). */
/* Effective type for an exercise instance: a per-exercise user override (set
   via the ⋯ menu, remembered globally by name) wins over the auto-detection. */
function effectiveType(e){
  if(!e) return 'weighted';
  if(e.type) return e.type;
  const pref = state.typePrefs[(e.name||'').toLowerCase()];
  return pref || exerciseType(e.name);
}
function exerciseType(name){
  const n=(name||'').toLowerCase();
  if(/\b(barbell|dumbbell|cable|machine|smith|ez-?bar|kettlebell|trap bar|goblet|plate|weighted|landmine)\b/.test(n)) return 'weighted';
  if(/(plank|wall sit|hollow|dead hang|\bhang\b|mountain climb|high knee|battle rope|jump rope|bear crawl|farmer|superman|jumping jack|wall ball|sprint|running|\brun\b|jog|cycl|\bbike\b|erg|elliptical|stair|swim|incline walk|skater|flutter)/.test(n)) return 'timed';
  if(/(push-?up|pull-?up|chin-?up|\bdips?\b|sit-?up|crunch|leg raise|russian twist|lunge|burpee|v-?up|toe touch|bird dog|dead bug|glute bridge|pistol|sissy|air squat|step-?up|knee raise)/.test(n)) return 'bodyweight';
  return 'weighted';
}
/* Most recent historical values for an exercise (for the greyed placeholder hint). */
function lastUsed(name){
  const k=(name||'').toLowerCase();
  const ws=state.workouts.filter(w=>w.status==='completed' && (!state.active||w.workoutId!==state.active.workoutId))
    .slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.updatedAt||0)-(a.updatedAt||0));
  for(const w of ws){
    const e=(w.exercises||[]).find(x=>x.name.toLowerCase()===k);
    if(e && e.sets.length){
      let best=null;
      e.sets.forEach(s=>{ if(s.completed){ if(!best || num(s.weight)>num(best.weight)) best=s; } });
      if(!best) best=e.sets[e.sets.length-1];
      if(best && (num(best.weight)>0||num(best.reps)>0)) return { weight:best.weight, reps:best.reps };
    }
  }
  return null;
}
/* Best historical record for PR detection (excludes the in-progress workout). */
function exerciseBest(name, excludeId){
  const k=(name||'').toLowerCase(); let mw=0, mr=0;
  state.workouts.filter(w=>w.status==='completed' && w.workoutId!==excludeId).forEach(w=>{
    (w.exercises||[]).forEach(e=>{ if(e.name.toLowerCase()!==k) return;
      e.sets.forEach(s=>{ if(!s.completed) return; mw=Math.max(mw,num(s.weight)); mr=Math.max(mr,num(s.reps)); }); });
  });
  return { weight:mw, reps:mr };
}
/* ---------- ALL-TIME BEST for an exercise ----------------------------------
   Powers the greyed-out numbers you see before you type: the target is the record
   to beat, not merely what you did last time. The workout you're in is excluded so
   the target can't drift upward underneath you mid-session. */
/* Records are read once per set row while logging, so memoise them. The cache is
   dropped whenever the workout list changes (see queueSaveWorkout / render). */
let _bestCache={};
function clearBestCache(){ _bestCache={}; }
function allTimeBest(name, excludeId){
  const ck=(name||'').toLowerCase()+'||'+(excludeId||'');
  if(_bestCache[ck]) return _bestCache[ck];
  return (_bestCache[ck]=allTimeBest_(name, excludeId));
}
function allTimeBest_(name, excludeId){
  const k=(name||'').toLowerCase();
  const out={ weight:0, reps:0, hold:0, sessionReps:0, sessionWork:0, work:0, date:'', sessions:0 };
  state.workouts.filter(w=>w.status==='completed' && w.workoutId!==excludeId).forEach(w=>{
    (w.exercises||[]).forEach(e=>{
      if((e.name||'').toLowerCase()!==k) return;
      const t=effectiveType(e);
      let sr=0, sw=0, any=false;
      e.sets.forEach(s=>{
        if(!s.completed) return;
        any=true;
        const wt=num(s.weight), rp=num(s.reps);
        if(wt>out.weight){ out.weight=wt; out.date=w.date; }
        if(t==='timed'){ if(rp>out.hold) out.hold=rp; }
        else { if(rp>out.reps) out.reps=rp; sr+=rp; }
        sw+=setWork(e.name,t,s);
      });
      if(any) out.sessions++;
      if(sr>out.sessionReps) out.sessionReps=sr;
      if(sw>out.sessionWork) out.sessionWork=sw;
      out.work+=sw;
    });
  });
  return out;
}
/* ---------- BEST DAY: the bar to clear for this whole workout ---------------
   Matched on the workout name, so "Back, Shoulders & Core" is graded against every
   previous "Back, Shoulders & Core" — the same idea as the per-exercise record but
   for the session as a whole. */
function dayBest(name, excludeId){
  const ck='day||'+(name||'').trim().toLowerCase()+'||'+(excludeId||'');
  if(_bestCache[ck]) return _bestCache[ck];
  return (_bestCache[ck]=dayBest_(name, excludeId));
}
function dayBest_(name, excludeId){
  const k=(name||'').trim().toLowerCase();
  const out={ work:0, reps:0, hold:0, sets:0, volume:0, date:'', count:0, lastWork:0, lastDate:'' };
  if(!k) return out;
  const prior=state.workouts
    .filter(w=>w.status==='completed' && w.workoutId!==excludeId && (w.name||'').trim().toLowerCase()===k)
    .sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  prior.forEach(w=>{
    out.count++;
    const wk=workoutWork(w);
    if(wk>out.work){ out.work=wk; out.date=w.date; }
    out.reps=Math.max(out.reps, workoutReps(w));
    out.hold=Math.max(out.hold, workoutHold(w));
    out.sets=Math.max(out.sets, workoutSetsDone(w));
    out.volume=Math.max(out.volume, workoutVolume(w));
  });
  if(prior.length){ out.lastWork=workoutWork(prior[0]); out.lastDate=prior[0].date; }
  return out;
}
function fmtSetHint(type,w,r){
  if(type==='timed') return (num(r)||0)+'s';
  if(type==='bodyweight') return (num(r)||0)+' reps';
  return (num(w)||0)+' '+state.unit+' × '+(num(r)||0);
}
/* One-line "record to beat" for an exercise, in that exercise's own language. */
function bestHint(name, type, excludeId){
  const b=allTimeBest(name, excludeId);
  if(type==='timed') return b.hold>0 ? b.hold+'s hold' : '';
  if(type==='bodyweight'){
    if(!b.reps) return '';
    return b.reps+' reps' + (b.sessionReps>b.reps ? ' · '+b.sessionReps+' in a session' : '');
  }
  if(!b.weight && !b.reps) return '';
  return Math.round(b.weight)+' '+state.unit+' × '+b.reps+' reps';
}
function collapsedHint(e,type){
  let s=null; e.sets.forEach(x=>{ if(num(x.weight)>0||num(x.reps)>0){ if(!s||num(x.weight)>num(s.weight)||(num(x.weight)===num(s.weight)&&num(x.reps)>num(s.reps))) s=x; } });
  if(s) return fmtSetHint(type, s.weight, s.reps);
  const bh=bestHint(e.name, type, state.active&&state.active.workoutId);
  if(bh) return 'best '+bh;
  const lu=lastUsed(e.name); if(lu) return 'last '+fmtSetHint(type, lu.weight, lu.reps);
  return '';
}

/* ---------- WORK: the one number every exercise can earn ---------------------
   Weight × reps only ever rewarded barbells and dumbbells, so push-ups, chin-ups,
   planks and crunches scored a flat zero — they never moved the lifetime total or
   the per-exercise charts. "Work" fixes that: a bodyweight rep counts the share of
   your body weight that movement actually lifts, and a timed hold counts seconds.
     • weighted   → weight × reps                    (unchanged, real iron)
     • bodyweight → (bodyWeight × leverage + added) × reps
     • timed      → bodyWeight × leverage × seconds / SEC_PER_REP
   Everything is expressed in your unit (lbs by default) so one number ranks a
   push-up day against a bench day. */
const BW_DEFAULT = 180;      // used until you set your body weight in Settings
const SEC_PER_REP = 4;       // 4 seconds of a hold ≈ one rep of work

/* Share of body weight each movement actually lifts. More specific patterns
   MUST come first — the first match wins. */
const BW_FACTORS = [
  [/muscle-?up/, 1.15],
  [/weighted (pull|chin)/, 1.00],
  [/pull-?up|chin-?up/, 1.00],
  [/\bdips?\b|dragon flag/, 1.00],
  [/pistol|sissy squat|nordic/, 0.85],
  [/knee push-?up|incline push-?up/, 0.50],
  [/diamond push-?up|decline push-?up|plyometric push-?up|wide push-?up/, 0.70],
  [/push-?up/, 0.64],
  [/burpee|devil press|man maker/, 0.75],
  [/inverted row|bear crawl/, 0.60],
  [/lunge|step-?up|split squat|box step/, 0.65],
  [/squat|wall sit|good morning/, 0.65],
  [/box jump|jump squat|skater|jumping jack|high knee|mountain climb|jump rope|ab wheel/, 0.45],
  [/glute bridge|hip thrust|back extension|superman/, 0.45],
  [/leg raise|knee raise|v-?up|toe touch|flutter|hanging/, 0.40],
  [/sit-?up|crunch|russian twist|bicycle|hollow|sit-up throw/, 0.35],
  [/plank|dead bug|bird dog|side plank/, 0.30],
  [/stretch|pose|foam roll|cat-cow|downward dog|thread the needle/, 0.10],
];
function bodyWeight(){ const n=num(state.bodyWeight); return n>0 ? n : BW_DEFAULT; }
function bwFactor(name){
  const n=(name||'').toLowerCase();
  for(const [rx,f] of BW_FACTORS){ if(rx.test(n)) return f; }
  return 0.50;                                   // sensible middle for anything unknown
}
/* Work earned by ONE completed set. */
function setWork(exName, type, s){
  const wt=num(s.weight), rp=num(s.reps);
  if(type==='weighted') return wt*rp;
  const bw = bodyWeight()*bwFactor(exName);
  if(type==='timed') return bw*rp/SEC_PER_REP;   // the reps field holds seconds
  return (bw+wt)*rp;                             // reps-only (a weighted vest still counts)
}
function exerciseWork(e){
  const t=effectiveType(e); let v=0;
  (e.sets||[]).forEach(s=>{ if(s.completed) v+=setWork(e.name,t,s); });
  return v;
}
function workoutWork(w){ let v=0; (w.exercises||[]).forEach(e=>v+=exerciseWork(e)); return v; }
/* Pure iron moved — kept honest and separate, shown alongside work. */
function workoutVolume(w){ let v=0; (w.exercises||[]).forEach(e=>e.sets.forEach(s=>{ if(s.completed) v+=num(s.weight)*num(s.reps); })); return v; }
/* Reps (non-timed) and seconds held (timed) across a whole workout. */
function workoutReps(w){ let c=0; (w.exercises||[]).forEach(e=>{ if(effectiveType(e)==='timed') return;
  e.sets.forEach(s=>{ if(s.completed) c+=num(s.reps); }); }); return c; }
function workoutHold(w){ let c=0; (w.exercises||[]).forEach(e=>{ if(effectiveType(e)!=='timed') return;
  e.sets.forEach(s=>{ if(s.completed) c+=num(s.reps); }); }); return c; }
function workoutSetsDone(w){ let c=0; (w.exercises||[]).forEach(e=>e.sets.forEach(s=>{ if(s.completed) c++; })); return c; }
function workoutSetsTotal(w){ let c=0; (w.exercises||[]).forEach(e=>c+=e.sets.length); return c; }
const fmtVol = v => v>=1e6 ? (v/1e6).toFixed(v>=1e7?0:1).replace(/\.0$/,'')+'M'
                  : v>=1000 ? (v/1000).toFixed(v>=1e5?0:1).replace(/\.0$/,'')+'k'
                  : Math.round(v).toString();
const fmtInt = n => Math.round(n).toLocaleString();
function fmtDur(sec){
  sec=Math.round(sec);
  if(sec<60) return sec+'s';
  if(sec<3600) return Math.round(sec/60)+'m';
  const h=sec/3600;
  return (h>=10?Math.round(h):h.toFixed(1).replace(/\.0$/,''))+'h';
}

/* ---------- muscle grouping (used to categorise the exercise lists) ---------- */

  if(/reverse fl|rear delt|face pull/.test(n)) return 'Shoulders';
  if(/bench|chest|pec|push-?up|svend/.test(n)) return 'Chest';
  if(/\bfly\b|flies/.test(n)) return 'Chest';
  if(/pull-?up|chin-?up|pulldown|\blat\b|\brows?\b|deadlift|shrug|back extension|good morning|superman|straight-arm/.test(n)) return 'Back';
  if(/shoulder|overhead press|arnold|lateral raise|front raise|upright row|push press|push jerk|delt|landmine press|snatch|clean|jerk|thruster/.test(n)) return 'Shoulders';
  if(/squat|lunge|leg press|leg extension|leg curl|step-?up|wall sit|calf|glute|hip thrust|hip abduction|hip adduction|nordic|kettlebell swing|pull-through|split squat/.test(n)) return 'Legs';
  if(/curl|bicep|tricep|skull|pushdown|\bdips?\b|jm press|kickback/.test(n)) return 'Arms';
  if(/plank|crunch|sit-?up|abdominal|\bab\b|leg raise|knee raise|russian|hollow|dead bug|bird dog|woodchopper|pallof|v-?up|toe touch|flutter|dragon flag|oblique|core/.test(n)) return 'Core';
  if(/\brun\b|running|sprint|walk|erg|cycl|\bbike\b|elliptical|stair|swim|jump rope|burpee|box jump|jumping jack|high knee|battle rope|sled|bear crawl|carry|mountain climb|skater|tire flip|sledgehammer|wall ball|medicine ball/.test(n)) return 'Conditioning';
  if(/stretch|pose|foam roll|cat-cow|thread the needle|downward dog/.test(n)) return 'Mobility';
  return 'Other';

/* ---------- API layer ----------------------------------------------------
   Works in TWO modes automatically:
   • Hosted INSIDE Apps Script (served by Code.gs)  -> uses google.script.run
   • Standalone file / hosted elsewhere             -> uses fetch() to apiUrl  */
function inGAS(){ return typeof google!=='undefined' && !!(google.script && google.script.run); }
function gasRun(fn){
  const args=[].slice.call(arguments,1);
  return new Promise((resolve,reject)=>{
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(null,args);
  });
}
async function apiGet(){
  if(state.gas) return await gasRun('getData');
  if(!state.apiUrl) return null;
  const r = await fetch(state.apiUrl + '?action=getData', { method:'GET' });
  if(!r.ok) throw new Error('GET '+r.status);
  return await r.json();
}
async function apiPost(action, payload){
  payload = payload || {};
  if(state.gas){
    switch(action){
      case 'saveWorkout':   return await gasRun('saveWorkout', payload.workout);
      case 'deleteWorkout': return await gasRun('deleteWorkout', payload.workoutId);
      case 'saveDay':       return await gasRun('saveDay', payload.day, payload.oldName||'');
      case 'deleteDay':     return await gasRun('deleteDay', payload.name);
      case 'saveSettings':  return await gasRun('saveSettings', payload.settings);
      default:              return await gasRun('getData');
    }
  }
  if(!state.apiUrl) return { ok:false, offline:true };
  // text/plain avoids a CORS preflight that Apps Script can't answer
  const r = await fetch(state.apiUrl, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload })
  });
  if(!r.ok) throw new Error('POST '+r.status);
  return await r.json();
}

let saveTimer=null, saveQueue=new Set(), _flushing=false;
function queueSaveWorkout(w){
  // optimistic local update
  const i = state.workouts.findIndex(x=>x.workoutId===w.workoutId);
  if(i>=0) state.workouts[i]=w; else state.workouts.unshift(w);
  // Records exclude the workout you're in, so mid-session edits can't change them —
  // only a new row or a finished workout invalidates the memoised bests.
  if(i<0 || w.status==='completed') clearBestCache();
  cacheSave();
  saveQueue.add(w.workoutId);
  setSaveFlag('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSaves, 700);
}
async function flushSaves(){
  if(!state.apiUrl && !state.gas){ setSaveFlag('local'); return; }   // device-only
  if(_flushing){ clearTimeout(saveTimer); saveTimer=setTimeout(flushSaves,250); return; }  // never overlap saves
  _flushing=true;
  try{
    while(saveQueue.size){                       // drain fully so late edits still get saved
      const ids=[...saveQueue]; saveQueue.clear();
      for(const id of ids){
        const w = state.workouts.find(x=>x.workoutId===id);
        if(w) await apiPost('saveWorkout', { workout:w });
      }
    }
    setSaveFlag('saved');
  }catch(e){ setSaveFlag('local'); }
  finally{ _flushing=false; }
}
function setSaveFlag(s){
  const el=$('#saveFlag'); if(!el) return;
  const map={ saving:['Saving…','text-mute'], saved:['Saved','accent-text'], local:['Saved on device','text-mute'] };
  const [t,c]=map[s]||['',''];
  el.className='text-[11px] font-semibold '+c;
  el.textContent=t;
}

/* =================================================================

async function boot(){
  cacheLoad();
  bindNav();
  bindDelegation();
  // flush any pending save the moment the screen sleeps / app backgrounds
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) flushSaves(); });
  window.addEventListener('pagehide',()=>{ flushSaves(); });
  state.loading=true;
  render();              // paint from cache instantly (shows "Reconnecting…" if empty)
  state.gas = await waitForGAS();   // wait for Apps Script bridge before deciding we're offline
  if(state.apiUrl || state.gas){
    const res = await apiGetRetry(4);
    state.loading=false;
    if(res.ok){
      applyCloud(res.data);
      state.loadFailed=false;
      // brand-new empty sheet → seed the 4 default days once (and push them)
      if(!state.workouts.length && !Object.keys(state.days).length && !Store.get(KEY.seeded)) seedExampleDays(true);
    } else {
      state.loadFailed=true;
      state.loadErr = res.err ? String(res.err && res.err.message || res.err) : 'Could not reach the Sheet';
    }
    render();
  } else {
    state.loading=false;
    // first run, device-only: seed the 4 default days once
    if(!state.workouts.length && !Object.keys(state.days).length && !Store.get(KEY.seeded)) seedExampleDays(false);
    render();
  }
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
/* Wait for Google's google.script bridge (Apps-Script-hosted mode). If the
   `google` object never appears we're a standalone file, so stop early. */
async function waitForGAS(maxMs=6000){
  const start=Date.now();
  while(Date.now()-start<maxMs){
    if(typeof google!=='undefined' && google.script && google.script.run) return true;
    if(typeof google==='undefined' && Date.now()-start>900) return false;
    await sleep(120);
  }
  return typeof google!=='undefined' && !!(google.script && google.script.run);
}
async function apiGetRetry(tries=4){
  let lastErr=null;
  for(let i=0;i<tries;i++){
    try{ const d=await apiGet(); if(d===null || (d && d.ok)) return { ok:true, data:d }; lastErr=new Error(d&&d.error||'bad response'); }
    catch(e){ lastErr=e; }
    await sleep(500*(i+1));
  }
  return { ok:false, err:lastErr };
}
async function retryConnect(){
  state.loading=true; state.loadFailed=false; render();
  state.gas = await waitForGAS();
  const res = await apiGetRetry(4);
  state.loading=false;
  if(res.ok){ applyCloud(res.data); state.loadFailed=false; }
  else { state.loadFailed=true; state.loadErr = res.err ? String(res.err && res.err.message || res.err) : 'Could not reach the Sheet'; }
  render();
}
function pushAllDays(){
  if(!(state.apiUrl||state.gas)) return;
  Object.values(state.days).forEach(d=>{ apiPost('saveDay',{ day:d, oldName:'' }).catch(()=>{}); });
}
function pushAllWorkouts(){
  if(!(state.apiUrl||state.gas)) return;
  state.workouts.forEach(w=>{ apiPost('saveWorkout',{ workout:w }).catch(()=>{}); });
}
/* Merge a cloud snapshot WITHOUT ever destroying local data:
   if the cloud comes back empty (slow/failed write, fresh tab) we keep what we
   have and re-push it, so toggling units / re-syncing can never wipe your days. */
function applyCloud(data, pullUnit=true){
  if(!data || !data.ok) return;
  state.online=true; clearBestCache();
  const cDays=data.days||{}, cW=data.workouts||[];
  if(Object.keys(cDays).length){ state.days=cDays; }
  else if(Object.keys(state.days).length){ pushAllDays(); }   // cloud empty, we have local -> restore upward
  if(cW.length){ state.workouts=cW.sort(sortWorkouts); }
  else if(state.workouts.length){ pushAllWorkouts(); }        // cloud empty, we have local -> restore upward
  if(pullUnit && data.settings && data.settings.unit){ state.unit=data.settings.unit; Store.set(KEY.unit,state.unit); }
  if(data.settings && data.settings.typePrefs){ try{ state.typePrefs=JSON.parse(data.settings.typePrefs)||{}; Store.set(KEY.tp,JSON.stringify(state.typePrefs)); }catch(e){} }
  if(data.settings && num(data.settings.bodyWeight)>0){ state.bodyWeight=String(num(data.settings.bodyWeight)); Store.set(KEY.bw,state.bodyWeight); }
  cacheSave();
}
function sortWorkouts(a,b){
  const ip = (a.status==='in_progress')?1:0, ip2=(b.status==='in_progress')?1:0;
  if(ip!==ip2) return ip2-ip;            // in-progress first
  return (b.date||'').localeCompare(a.date||'') || (b.updatedAt||0)-(a.updatedAt||0);
}
function mkDay(name, list){ // list = ["Exercise:sets", ...]  (sets default 3)
  return { name, exercises:list.map((s,i)=>{ const [n,st]=s.split(':'); return {name:n, sets:st?+st:3, order:i}; }) };
}

/* =================================================================
   NAVIGATION
   ================================================================= */
function bindNav(){
  $$('#bottomNav [data-nav]').forEach(b=>b.addEventListener('click',()=>{
    const v=b.dataset.nav;
    if(v==='log'){ openLogTab(); return; }
    go(v);
  }));
}
/* Delegated clicks for actions that carry free-text names (apostrophe-safe:
   dataset values are decoded as text, never executed as JS). */
function bindDelegation(){
  document.addEventListener('click', e=>{
    const add=e.target.closest('[data-exadd]');
    if(add){ addExerciseByName(add.dataset.exadd, add.dataset.custom==='1'); return; }
    const t=e.target.closest('[data-act]'); if(!t) return;
    const act=t.dataset.act, val=t.dataset.val||'';
    if(act==='startDay')      startFromDay(val);
    else if(act==='editDay')  openDayEditor(val);
    else if(act==='openEx')   openExercise(val);
    else if(act==='histDay')  setHistDay(val);
  });
}
function go(view){ state.view=view; render(); window.scrollTo({top:0,behavior:'instant'}); }
function setActiveNav(){
  $$('#bottomNav [data-nav]').forEach(b=>{
    const on = b.dataset.nav===state.view || (state.view==='logger' && b.dataset.nav==='log');
    b.classList.toggle('text-white', on);
    b.classList.toggle('accent-text', false);
    b.querySelector('span').style.color = on ? 'var(--volt)' : '';
    b.querySelector('svg').style.color = on ? 'var(--volt)' : '';
  });
}
function openLogTab(){
  if(state.active){ go('logger'); return; }
  const ip = state.workouts.find(w=>w.status==='in_progress');
  if(ip){ state.active=structuredClone(ip); go('logger'); return; }
  openStartSheet();
}

/* =================================================================
   RENDER ROUTER
   ================================================================= */
function render(){
  const app=$('#app');
  clearBestCache();
  let html='';
  // Connection guard: if we're cloud-backed but have nothing loaded yet, show a
  // clear reconnect state instead of a misleading "empty" home.
  const empty = !Object.keys(state.days).length && !state.workouts.length;
  if((state.apiUrl||state.gas) && empty && (state.loading||state.loadFailed) && state.view!=='logger'){
    app.innerHTML = `<div class="view safe-bottom">${viewReconnect()}</div>`;
    $('#bottomNav').classList.remove('hidden-imp'); setActiveNav();
    return;
  }
  switch(state.view){
    case 'home':     html=viewHome(); break;
    case 'logger':   html=viewLogger(); break;
    case 'history':  html=viewHistory(); break;
    case 'progress': html=viewProgress(); break;
    case 'exercise': html=viewExerciseDetail(); break;
    case 'days':     html=viewDays(); break;
    default:         html=viewHome();
  }
  app.innerHTML = `<div class="view safe-bottom">${html}</div>`;
  $('#bottomNav').classList.toggle('hidden-imp', state.view==='logger'); // focused logging mode
  setActiveNav();
  afterRender();
}
function afterRender(){
  if(state.view==='logger') wireLogger();
  if(state.view==='progress') drawProgressCharts();
  if(state.view==='exercise') drawExerciseChart();
}

/* Greyed-out benchmark for the WHOLE session: today's work against the best you
   have ever done on this same day. Reps ride along so a pure-bodyweight day still
   has something concrete to chase. */
function dayCmpHtml(w){
  const b=dayBest(w.name, w.workoutId);
  const work=workoutWork(w), reps=workoutReps(w), hold=workoutHold(w);
  if(!b.count){
    return `<div class="text-[10px] text-mute text-center">First <b class="text-white">${esc(w.name)}</b> — today sets the benchmark.</div>`;
  }
  const pct=b.work>0 ? Math.min(100, Math.round(100*work/b.work)) : 0;
  const beat=b.work>0 && work>b.work;
  const repPart = b.reps>0 ? ` · <b class="${reps>b.reps?'text-white':''}">${fmtInt(reps)}</b>/${fmtInt(b.reps)} reps` : '';
  const holdPart = b.hold>0 ? ` · <b class="${hold>b.hold?'text-white':''}">${fmtDur(hold)}</b>/${fmtDur(b.hold)}` : '';
  return `<div class="flex items-center justify-between text-[10px] font-semibold gap-2">
      <span class="${beat?'edge-text font-bold tracking-widest':'text-mute tracking-widest'} shrink-0">${beat?'NEW BEST DAY':'VS BEST DAY'}</span>
      <span class="text-mute truncate text-right"><b class="text-white font-display">${fmtVol(work)}</b>/${fmtVol(b.work)} ${state.unit}${repPart}${holdPart}</span>
    </div>
    <div class="h-1 rounded-full bg-line overflow-hidden mt-1"><div class="h-full ${beat?'bg-white':'bg-white/45'} transition-all duration-300" style="width:${beat?100:pct}%"></div></div>`;
}
function exerciseCard(e,i){
  const type=effectiveType(e);
  const done=e.sets.filter(s=>s.completed).length, tot=e.sets.length;
  const allDone = tot>0 && done===tot;

  if(e.collapsed){
    const hint=collapsedHint(e,type);
    return `<div class="card p-3" data-ex="${i}">
      <button onclick="toggleCollapse(${i})" class="w-full flex items-center justify-between gap-2 text-left">
        <div class="min-w-0">
          <div class="font-display font-700 text-base truncate">${esc(e.name)}</div>
          <div class="text-[11px] text-mute mt-0.5">${done}/${tot} sets${hint?' · '+esc(hint):''}</div>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          ${allDone?`<span class="w-5 h-5 rounded-full bg-white flex items-center justify-center"><svg class="w-3.5 h-3.5 text-ink" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" d="m5 13 4 4L19 7"/></svg></span>`:''}
          <svg class="w-5 h-5 text-mute" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>
        </div>
      </button>
    </div>`;
  }

  const cols = type==='weighted' ? 'grid-cols-[28px_1fr_1fr_44px]' : 'grid-cols-[28px_1fr_44px]';
  const head = type==='weighted'
    ? `<div class="text-center">SET</div><div class="text-center">${state.unit.toUpperCase()}</div><div class="text-center">REPS</div><div class="text-center">✓</div>`
    : type==='timed'
      ? `<div class="text-center">SET</div><div class="text-center">SEC</div><div class="text-center">✓</div>`
      : `<div class="text-center">SET</div><div class="text-center">REPS</div><div class="text-center">✓</div>`;
  return `<div class="card p-3" data-ex="${i}">
    <div class="flex items-center justify-between gap-2">

/* "Record to beat" strip under an exercise's name while logging.
   Weighted movements get their PB in words; reps-only and timed movements also get
   a bar tracking THIS session's total against your best-ever session — that is the
   scoreboard bodyweight work never had. */
function exBestBar(e,i,type){
  const excl = state.active && state.active.workoutId;
  const b = allTimeBest(e.name, excl);
  const pb = bestHint(e.name, type, excl);
  if(!pb && !b.sessionReps) return '';
  const isRep = type!=='weighted';
  let bar='';
  if(isRep && b.sessionReps>0){
    let cur=0; e.sets.forEach(s=>{ if(s.completed) cur+=num(s.reps); });
    const pct=Math.min(100, Math.round(100*cur/b.sessionReps));
    const beat=cur>b.sessionReps;
    const label = type==='timed' ? fmtDur(cur)+' / '+fmtDur(b.sessionReps) : cur+' / '+b.sessionReps+' reps';
    bar = `<div class="mt-1.5">
      <div class="flex items-center justify-between text-[10px] font-semibold">
        <span class="text-mute">SESSION BEST</span>
        <span class="${beat?'edge-text font-bold':'text-mute'}">${beat?'BEAT IT · ':''}${esc(label)}</span>
      </div>
      <div class="h-1 rounded-full bg-line overflow-hidden mt-1"><div class="h-full ${beat?'bg-white':'bg-white/45'}" style="width:${pct}%"></div></div>
    </div>`;
  }
  return `${ pb ? `<div class="text-[10px] text-mute mt-1 px-0.5 truncate"><span class="font-bold tracking-widest">BEST</span> ${esc(pb)}${b.date?' · '+esc(fmtDateShort(b.date)):''}</div>` : '' }${bar}`;
}
function setRow(i,j,s,type){
  const ex = state.active.exercises[i];
  type = type || effectiveType(ex);
  // Greyed placeholders = your ALL-TIME BEST for this movement (the record to beat),
  // falling back to the last session's numbers until a record exists.
  const b  = allTimeBest(ex.name, state.active.workoutId);
  const lu = lastUsed(ex.name);
  const bestR = type==='timed' ? b.hold : b.reps;
  const wph = b.weight>0 ? String(Math.round(b.weight)) : (lu && num(lu.weight)>0 ? String(num(lu.weight)) : '0');
  const rph = bestR>0     ? String(Math.round(bestR))   : (lu && num(lu.reps)>0   ? String(num(lu.reps))   : '0');
  const setno=`<div class="text-center font-display font-700 text-sm text-mute">${j+1}</div>`;
  const check=`<button onclick="toggleSet(${i},${j})" class="mx-auto w-8 h-8 rounded-lg btn-press flex items-center justify-center ${s.completed?'':'chip'}" style="${s.completed?'background:var(--volt)':''}">

    </button>`;
  if(type==='weighted'){
    return `<div class="grid grid-cols-[28px_1fr_1fr_44px] gap-2 items-center rounded-lg border border-line p-1 ${s.completed?'set-done':''}" data-row="${i}-${j}">

      <input type="number" inputmode="numeric" value="${s.reps}" placeholder="${rph}"
        oninput="onSet(${i},${j},'reps',this.value)" class="bg-transparent text-center font-display font-600 text-base py-1.5 w-full outline-none placeholder:text-mute placeholder:opacity-60" />
      ${check}
    </div>`;
  }
  return `<div class="grid grid-cols-[28px_1fr_44px] gap-2 items-center rounded-lg border border-line p-1 ${s.completed?'set-done':''}" data-row="${i}-${j}">
    ${setno}

      oninput="onSet(${i},${j},'reps',this.value)" class="bg-transparent text-center font-display font-600 text-base py-1.5 w-full outline-none placeholder:text-mute placeholder:opacity-60" />

function checkPR(i,j,type){

/* Records that only a whole session can break: total reps on a bodyweight
   movement, total time on a hold, and the work total for the day itself.
   Must run BEFORE the workout is marked complete so it isn't compared to itself. */
function sessionPRCelebs(w){
  const out=[], excl=w.workoutId;
  (w.exercises||[]).forEach(e=>{
    const type=effectiveType(e);
    if(type==='weighted') return;                       // already covered set-by-set
    const b=allTimeBest(e.name, excl);
    let cur=0; e.sets.forEach(s=>{ if(s.completed) cur+=num(s.reps); });
    if(cur>0 && b.sessionReps>0 && cur>b.sessionReps){
      out.push({ icon:'trophy', kind:'SESSION RECORD', title:e.name,
        desc: type==='timed' ? `${fmtDur(cur)} held — most ever in one workout`
                             : `${cur} reps — most ever in one workout` });
    }
  });
  const db=dayBest(w.name, excl), work=workoutWork(w);
  if(db.count && db.work>0 && work>db.work){
    out.push({ icon:'mountain', kind:'BEST DAY EVER', title:w.name,
      desc:`${fmtVol(work)} ${state.unit} of work — beats ${fmtVol(db.work)}` });
  }
  return out;
}
function doFinish(){
  const w=state.active;
  const beforeIds=computeBadges().filter(b=>b.earned).map(b=>b.id);  // before this one counts
  const prs=sessionPRCelebs(w);                                      // measured before it counts too
  w.status='completed'; w.updatedAt=Date.now();
  queueSaveWorkout(w); flushSaves();
  state.workouts.sort(sortWorkouts);
  const fresh=computeBadges().filter(b=>b.earned && !beforeIds.includes(b.id));
  state.active=null; closeModal();
  go('home');
  // queue AFTER the view swap — go() would otherwise tear down the first popup.
  // Records come first, then milestones; a huge session is capped at 5 popups so
  // finishing never turns into a tapping exercise.
  const queue=prs.concat(fresh.map(b=>({ icon:b.icon, kind:'MILESTONE UNLOCKED', title:b.name, desc:b.desc })));
  if(!queue.length){ toast('Workout complete 🔥'); return; }
  const extra=queue.length-5;
  queue.slice(0,5).forEach(c=>enqueueCeleb(c));
  if(extra>0) setTimeout(()=>toast('+'+extra+' more unlocked — see Progress'), 400);
}
function discardWorkout(){
  const w=state.active; if(!w) return;
  const done=w.status==='completed';
  confirm2(done?'Delete workout?':'Discard workout?','This permanently removes it.',done?'Delete':'Discard',()=>{
    // update UI immediately, delete on the server in the background (don't block the button)
    state.workouts=state.workouts.filter(x=>x.workoutId!==w.workoutId);
    state.active=null; cacheSave();
    closeModal(); go('home');
    apiPost('deleteWorkout',{ workoutId:w.workoutId }).catch(()=>{});
  });
}

function allExerciseStats(src){
  const map={};
  (src || state.workouts.filter(w=>w.status==='completed')).forEach(w=>{
    (w.exercises||[]).forEach(e=>{
      const k=e.name.toLowerCase();
      if(!map[k]) map[k]={ name:e.name, type:effectiveType(e), group:muscleGroup(e.name), sessions:0,
        maxWeight:0, maxReps:0, maxHold:0, maxOneRm:0, maxSessionReps:0, maxSessionWork:0,
        totalVolume:0, totalWork:0, totalReps:0, totalHold:0,
        points:[], bestWeightDate:'', bestRepsDate:'', bestSessionDate:'' };
      const m=map[k]; m.sessions++;
      const type=effectiveType(e); m.type=type;
      let sessVol=0, sessWork=0, sessReps=0, sessHold=0, sessMaxW=0, sessMaxR=0, sessMaxH=0, sessRm=0;
      e.sets.forEach(s=>{ if(!s.completed) return; const wt=num(s.weight), rp=num(s.reps);
        sessVol+=wt*rp; sessWork+=setWork(e.name,type,s);
        if(type==='timed'){ sessHold+=rp; if(rp>sessMaxH) sessMaxH=rp; }
        else { sessReps+=rp; if(rp>sessMaxR) sessMaxR=rp; }
        if(wt>sessMaxW) sessMaxW=wt;
        const rm=wt*(1+rp/30); if(rm>sessRm) sessRm=rm; });
      m.totalVolume+=sessVol; m.totalWork+=sessWork; m.totalReps+=sessReps; m.totalHold+=sessHold;
      m.points.push({id:w.workoutId, date:w.date, volume:sessVol, work:sessWork, reps:sessReps, hold:sessHold,
        maxWeight:sessMaxW, maxReps:sessMaxR, maxHold:sessMaxH, oneRm:sessRm});
    });
  });
  Object.values(map).forEach(m=>{
    m.points.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    let rw=0, rr=0, rh=0, rsr=0, rsw=0;              // running maxima -> PR flags
    m.points.forEach(p=>{
      p.weightPR = p.maxWeight>rw && p.maxWeight>0; if(p.weightPR){ rw=p.maxWeight; m.bestWeightDate=p.date; }
      p.repsPR   = p.maxReps>rr   && p.maxReps>0;   if(p.repsPR){   rr=p.maxReps;   m.bestRepsDate=p.date; }
      p.holdPR   = p.maxHold>rh   && p.maxHold>0;   if(p.holdPR)    rh=p.maxHold;
      // session-total records: the record a bodyweight movement can actually break
      p.sessionRepsPR = p.reps>rsr && p.reps>0;     if(p.sessionRepsPR) rsr=p.reps;
      p.sessionPR     = p.work>rsw && p.work>0;     if(p.sessionPR){ rsw=p.work; m.bestSessionDate=p.date; }
    });
    m.maxWeight=rw; m.maxReps=rr; m.maxHold=rh; m.maxSessionReps=rsr; m.maxSessionWork=rsw;
    m.maxOneRm=Math.max(0,...m.points.map(p=>p.oneRm));
  });
  return Object.values(map).sort((a,b)=>b.sessions-a.sessions);
}

/* ---------- time helpers for weekly charts / streaks / badges ---------- */
function weekStartDate(iso){ const d=new Date(iso+'T00:00:00'); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off); return d; } // Monday
function weekKey(iso){ return weekStartDate(iso).toISOString().slice(0,10); }
function tfCutoff(tf){ const days={'6w':42,'12w':84,'26w':182}[tf]; if(days==null) return null; const d=new Date(); d.setDate(d.getDate()-days); return d.toISOString().slice(0,10); }
function weeklySeries(tf){
  const done=state.workouts.filter(w=>w.status==='completed' && w.date);
  if(!done.length) return { labels:[], counts:[], volumes:[] };
  const cut=tfCutoff(tf);
  const startIso = cut || done.reduce((m,w)=> w.date<m?w.date:m, done[0].date);
  let cur=weekStartDate(startIso); const end=weekStartDate(todayISO());
  const buckets=[], idx={};
  while(cur<=end && buckets.length<80){ const k=cur.toISOString().slice(0,10); idx[k]=buckets.length; buckets.push({k,count:0,vol:0}); cur.setDate(cur.getDate()+7); }
  done.forEach(w=>{ if(cut && w.date<cut) return; const i=idx[weekKey(w.date)]; if(i!=null){ buckets[i].count++; buckets[i].vol+=workoutWork(w); } });
  return {
    labels: buckets.map(b=>new Date(b.k+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})),
    counts: buckets.map(b=>b.count),
    volumes: buckets.map(b=>Math.round(b.vol)),
  };
}
function weekStreak(){
  const wk=new Set(state.workouts.filter(w=>w.status==='completed'&&w.date).map(w=>weekKey(w.date)));
  let cur=weekStartDate(todayISO()), streak=0;
  if(!wk.has(cur.toISOString().slice(0,10))) cur.setDate(cur.getDate()-7); // grace: current week not done yet
  while(wk.has(cur.toISOString().slice(0,10))){ streak++; cur.setDate(cur.getDate()-7); }
  return streak;
}

function longestDayStreak(dateSet){
  const days=[...dateSet].filter(Boolean).sort();
  let best=0,cur=0,prev=null;
  days.forEach(d=>{ const t=new Date(d+'T00:00:00').getTime();
    if(prev!=null && Math.round((t-prev)/864e5)===1) cur++; else cur=1;
    if(cur>best) best=cur; prev=t; });
  return best;
}
function longestWeekRun(weekKeys){
  const arr=[...new Set(weekKeys)].filter(Boolean).sort();
  let best=0,cur=0,prev=null;
  arr.forEach(k=>{ const t=new Date(k+'T00:00:00').getTime();
    if(prev!=null && Math.round((t-prev)/(7*864e5))===1) cur++; else cur=1;
    if(cur>best) best=cur; prev=t; });
  return best;
}
function weekStreakMin(ws,min){ const wk={}; ws.forEach(w=>{ const k=weekKey(w.date); wk[k]=(wk[k]||0)+1; });
  return longestWeekRun(Object.keys(wk).filter(k=>wk[k]>=min)); }

/* =================================================================
   MILESTONES — categorised, and deliberately endless.
   -----------------------------------------------------------------
   The old list topped out at the Quarter-Million Club and then there was
   nothing left to chase. Every cumulative milestone here is a LADDER: a
   hand-picked run of rungs, and once you pass the top rung the ladder grows
   itself (each new rung a multiple of the last), so a target always exists.
   Rung sizes are scaled to a real Kinetic Haus session — roughly 20–30k of
   work, ~290 reps and ~3 minutes of holds across 24 sets — so the early rungs
   land in weeks and the far ones stay years away.
   ================================================================= */
function roundNice(n){
  const mag=Math.pow(10, Math.max(0, Math.floor(Math.log10(n))-1));
  return Math.round(n/mag)*mag;
}
/* All rungs up to and including the first one you have NOT cleared. */
function tierList(base, value, growth){
  growth=growth||2;
  const out=base.slice();
  let last=out[out.length-1], guard=0;
  while(value>=last && guard++<40){ last=roundNice(last*growth); out.push(last); }
  return out;
}
function ladder(o){
  return tierList(o.base, o.value, o.growth).map(t=>({
    cat:o.cat, lad:o.id, id:o.id+'_'+t, icon:o.icon,
    name:o.name(t), desc:o.desc(t), earned:o.value>=t, progress:o.value, goal:t
  }));
}
const CLUB_NAMES = { 250000:'Quarter-Million Club', 500000:'Half-Million Club', 1000000:'Million Pound Club' };
function clubName(t){ return CLUB_NAMES[t] || (fmtVol(t)+' Club'); }
const CAT_ORDER = ['Showing Up','Weight Moved','Bodyweight & Holds','Strength & PRs','Milestones'];

function computeBadges(src){
  const ws=(src || state.workouts.filter(w=>w.status==='completed')).slice().sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  const count=ws.length;
  const totalVol=ws.reduce((a,w)=>a+workoutVolume(w),0);
  const dateSet=new Set(ws.map(w=>w.date));
  let earlyAny=false, mornCount=0;
  ws.forEach(w=>{ if(w.updatedAt){ const h=new Date(w.updatedAt).getHours(); if(h<7) earlyAny=true; if(h<9) mornCount++; } });
  const wkCount={}; ws.forEach(w=>{ const k=weekKey(w.date); wkCount[k]=(wkCount[k]||0)+1; });
  const perfectWeek=Object.values(wkCount).some(c=>c>=5);
  const wkStreak3=weekStreakMin(ws,3);
  const dayStreak=longestDayStreak(dateSet);
  const monCount={}; ws.forEach(w=>{ const k=(w.date||'').slice(0,7); monCount[k]=(monCount[k]||0)+1; });
  const ironMonth=Object.values(monCount).some(c=>c>=20);
  const bigDay=ws.reduce((m,w)=>Math.max(m,workoutVolume(w)),0);
  const stats=allExerciseStats(ws);
  const anyPR=stats.some(m=>m.points.some((p,i)=>i>0 && (p.weightPR||p.repsPR)));
  const prWeeks=new Set(); stats.forEach(m=>m.points.forEach((p,i)=>{ if(i>0&&(p.weightPR||p.repsPR)) prWeeks.add(weekKey(p.date)); }));
  const overload=stats.some(m=>{ const pts=m.points.filter(p=>p.maxWeight>0); return pts.length>=2 && pts[pts.length-1].maxWeight>=1.5*pts[0].maxWeight; });
  const repGrowth=stats.some(m=>{ const pts=m.points.filter(p=>p.maxReps>0); return pts.length>=2 && pts[pts.length-1].maxReps>=Math.ceil(1.5*pts[0].maxReps); });
  const maxSessions=stats.reduce((m,x)=>Math.max(m,x.sessions),0);
  const seedNames=['Legs & Functional Core','Upper Body & Toning','Chest & Arms','Back, Shoulders & Core'];
  const usedAllSeed=seedNames.every(n=>ws.some(w=>w.name===n));
  const u=state.unit;

  // ---- totals that now include bodyweight and timed work ----
  const totalWork  = ws.reduce((a,w)=>a+workoutWork(w),0);
  const bigWork    = ws.reduce((m,w)=>Math.max(m,workoutWork(w)),0);
  const totalSets  = ws.reduce((a,w)=>a+workoutSetsDone(w),0);
  const totalReps  = ws.reduce((a,w)=>a+workoutReps(w),0);
  const totalHold  = ws.reduce((a,w)=>a+workoutHold(w),0);
  const bwStats    = stats.filter(m=>m.type==='bodyweight');
  const tmStats    = stats.filter(m=>m.type==='timed');
  const bwReps     = bwStats.reduce((a,m)=>a+m.totalReps,0);
  const bwWork     = stats.filter(m=>m.type!=='weighted').reduce((a,m)=>a+m.totalWork,0);
  const bestSessionReps = ws.reduce((m,w)=>Math.max(m,workoutReps(w)),0);
  const maxOneRm   = stats.reduce((m,x)=>Math.max(m,x.maxOneRm),0);
  const exTried    = stats.length;
  const daysUsed   = new Set(ws.map(w=>(w.name||'').trim().toLowerCase()).filter(Boolean)).size;
  const trainDays  = dateSet.size;
  const bwPRs      = stats.reduce((a,m)=>a+m.points.filter((p,i)=>i>0&&(p.sessionRepsPR||p.holdPR)).length,0);

  const out=[];
  const push=(...b)=>out.push(...b);

  /* ---------------- SHOWING UP ---------------- */
  const C1='Showing Up';
  push(...ladder({cat:C1, id:'wcount', icon:'flag', base:[1,10,25,50,100,200,365,500,750,1000], value:count, growth:1.5,
    name:t=>t===1?'First Rep':t+' Workouts', desc:t=>t===1?'Log your first workout':`Log ${fmtInt(t)} workouts`}));
  push(...ladder({cat:C1, id:'daystreak', icon:'flame', base:[3,7,14,30,60,100,200,365], value:dayStreak, growth:1.5,
    name:t=>t+'-Day Streak', desc:t=>`Train ${t} days in a row`}));
  push(...ladder({cat:C1, id:'wkstreak', icon:'flame', base:[4,8,12,26,52,104], value:wkStreak3, growth:2,
    name:t=>t+' Solid Weeks', desc:t=>`${t} straight weeks of 3+ workouts`}));
  push(...ladder({cat:C1, id:'traindays', icon:'star', base:[25,50,100,250,500,1000], value:trainDays, growth:2,
    name:t=>fmtInt(t)+' Training Days', desc:t=>`Train on ${fmtInt(t)} separate days`}));
  push(
    {cat:C1, id:'perfweek', icon:'star',    name:'Perfect Week', desc:'5+ workouts in one week',         earned:perfectWeek},
    {cat:C1, id:'ironmonth',icon:'mountain',name:'Iron Month',   desc:'20 workouts in a calendar month', earned:ironMonth},
    {cat:C1, id:'early',    icon:'sun',     name:'Early Bird',   desc:'Finish a workout before 7am',     earned:earlyAny},
  );
  push(...ladder({cat:C1, id:'morning', icon:'sun', base:[10,25,50,100,250], value:mornCount, growth:2,
    name:t=>t+' Mornings', desc:t=>`${t} workouts finished before 9am`}));

  /* ---------------- WEIGHT MOVED ---------------- */
  const C2='Weight Moved';
  push(...ladder({cat:C2, id:'work', icon:'mountain',
    base:[100e3,250e3,500e3,1e6,2e6,3.5e6,5e6,7.5e6,10e6,15e6,25e6,50e6,75e6,100e6], value:totalWork, growth:2,
    name:t=>clubName(t), desc:t=>`${fmtInt(t)} ${u} of total work all-time`}));
  push(...ladder({cat:C2, id:'iron', icon:'dumbbell',
    base:[250e3,500e3,1e6,2.5e6,5e6,10e6,25e6,50e6], value:totalVol, growth:2,
    name:t=>fmtVol(t)+' of Iron', desc:t=>`${fmtInt(t)} ${u} from weighted lifts alone`}));
  push(...ladder({cat:C2, id:'bigday', icon:'bolt',
    base:[15e3,25e3,40e3,55e3,70e3,90e3,120e3,150e3], value:bigWork, growth:1.35,
    name:t=>fmtVol(t)+' Session', desc:t=>`${fmtInt(t)} ${u} of work in one session`}));
  push(...ladder({cat:C2, id:'sets', icon:'dumbbell', base:[100,500,1000,2500,5000,10e3,25e3,50e3], value:totalSets, growth:2,
    name:t=>fmtInt(t)+' Sets', desc:t=>`Complete ${fmtInt(t)} sets all-time`}));

  /* ---------------- BODYWEIGHT & HOLDS ----------------
     Everything here scores movements that never earned a pound before. */
  const C3='Bodyweight & Holds';
  push(...ladder({cat:C3, id:'bwreps', icon:'bolt', base:[250,1000,2500,5000,10e3,25e3,50e3,100e3], value:bwReps, growth:2,
    name:t=>fmtInt(t)+' BW Reps', desc:t=>`${fmtInt(t)} bodyweight reps all-time`}));
  push(...ladder({cat:C3, id:'bwwork', icon:'mountain', base:[25e3,100e3,250e3,500e3,1e6,2.5e6,5e6], value:bwWork, growth:2,
    name:t=>fmtVol(t)+' Moved Raw', desc:t=>`${fmtInt(t)} ${u} moved with no equipment`}));
  push(...ladder({cat:C3, id:'hold', icon:'flame', base:[600,1800,3600,3*3600,6*3600,12*3600,24*3600], value:totalHold, growth:2,
    name:t=>fmtDur(t)+' Under Tension', desc:t=>`${fmtDur(t)} of planks, holds and carries`}));
  push(...ladder({cat:C3, id:'sessreps', icon:'star', base:[100,200,300,400,500,650,800,1000], value:bestSessionReps, growth:1.3,
    name:t=>t+' Reps in a Day', desc:t=>`${t} reps in a single workout`}));
  push(...ladder({cat:C3, id:'bwpr', icon:'trophy', base:[1,5,15,30,60,120], value:bwPRs, growth:2,
    name:t=>t===1?'Raw Record':t+' Raw Records', desc:t=>`Break ${t} bodyweight or hold record${t>1?'s':''}`}));

  // Per-movement clubs, built from the movements YOU actually repeat.
  bwStats.slice().sort((a,b)=>b.totalReps-a.totalReps).slice(0,4).forEach(m=>{
    if(m.totalReps<10) return;
    push(...ladder({cat:C3, id:'club_'+m.name.toLowerCase().replace(/\W+/g,''), icon:'medal',
      base:[100,250,500,1000,2500,5000,10e3,25e3], value:m.totalReps, growth:2,
      name:t=>fmtVol(t)+' '+m.name, desc:t=>`${fmtInt(t)} lifetime ${m.name} reps`}));
  });
  tmStats.slice().sort((a,b)=>b.totalHold-a.totalHold).slice(0,2).forEach(m=>{
    if(m.totalHold<60) return;
    push(...ladder({cat:C3, id:'hclub_'+m.name.toLowerCase().replace(/\W+/g,''), icon:'medal',
      base:[300,900,1800,3600,2*3600,5*3600,10*3600], value:m.totalHold, growth:2,
      name:t=>fmtDur(t)+' '+m.name, desc:t=>`${fmtDur(t)} of ${m.name} all-time`}));
  });

  /* ---------------- STRENGTH & PRs ---------------- */
  const C4='Strength & PRs';
  push(...ladder({cat:C4, id:'onerm', icon:'trophy', base:[95,135,185,225,275,315,365,405,495,585], value:maxOneRm, growth:1.2,
    name:t=>fmtInt(t)+' '+u+' Club', desc:t=>`Reach an estimated ${fmtInt(t)} ${u} one-rep max`}));
  push(...ladder({cat:C4, id:'prweeks', icon:'star', base:[3,10,25,50,100], value:prWeeks.size, growth:2,
    name:t=>'PRs in '+t+' Weeks', desc:t=>`Set a personal best in ${t} different weeks`}));
  push(...ladder({cat:C4, id:'special', icon:'medal', base:[10,25,50,100,200], value:maxSessions, growth:2,
    name:t=>t+'× Specialist', desc:t=>`Train one exercise in ${t} sessions`}));
  push(
    {cat:C4, id:'pr',       icon:'bolt',    name:'PR Setter',           desc:'Beat a previous best',        earned:anyPR},
    {cat:C4, id:'overload', icon:'dumbbell',name:'Progressive Overload',desc:'Add 50% to a lift over time', earned:overload},
    {cat:C4, id:'repgrow',  icon:'dumbbell',name:'Rep Machine',         desc:'Grow reps 50% on a movement', earned:repGrowth},
  );

  /* ---------------- MILESTONES / EXPLORATION ---------------- */
  const C5='Milestones';
  push(...ladder({cat:C5, id:'reps', icon:'bolt', base:[1000,5000,10e3,25e3,50e3,100e3,250e3,500e3], value:totalReps, growth:2,
    name:t=>fmtVol(t)+' Reps', desc:t=>`${fmtInt(t)} reps logged all-time`}));
  push(...ladder({cat:C5, id:'extried', icon:'star', base:[10,25,50,75,100,150,200], value:exTried, growth:1.5,
    name:t=>t+' Movements', desc:t=>`Log ${t} different exercises`}));
  push(...ladder({cat:C5, id:'daysused', icon:'crown', base:[4,6,8,12,16], value:daysUsed, growth:1.5,
    name:t=>t+' Day Types', desc:t=>`Train ${t} different named workouts`}));
  push({cat:C5, id:'full', icon:'crown', name:'Full Haus', desc:'Use all 4 starter day templates', earned:usedAllSeed});

  return out;
}
/* Milestones grouped for the collapsible Progress accordion. Within each ladder we
   only surface what you have already earned plus the next two rungs, so the grid
   never becomes the wall of locked tiles an endless ladder would otherwise be. */
function badgeCategories(src){
  const all=computeBadges(src);
  const byCat={};
  all.forEach(b=>{ (byCat[b.cat=b.cat||'Milestones']=byCat[b.cat]||[]).push(b); });
  return CAT_ORDER.filter(c=>byCat[c]).map(c=>{
    const list=byCat[c];
    const shown=[], seen={};
    list.forEach(b=>{
      if(!b.lad){ shown.push(b); return; }
      if(b.earned){ shown.push(b); return; }
      seen[b.lad]=(seen[b.lad]||0)+1;
      if(seen[b.lad]<=2) shown.push(b);            // the next two rungs of this ladder
    });
    return { name:c, all:list, shown, earned:list.filter(b=>b.earned).length, total:list.length };
  });
}
function badgeTile(b){
  const ring = b.earned ? 'edge-ring' : 'border border-line';
  const ic   = b.earned ? 'text-white' : 'text-mute opacity-40';
  const pct  = (b.goal && !b.earned) ? Math.min(100, Math.round(100*(b.progress||0)/b.goal)) : (b.earned?100:0);
  return `<button onclick="badgeInfo('${b.id}')" class="btn-press relative rounded-2xl ${ring} bg-panel2 p-2.5 flex flex-col items-center gap-1 text-center">
    <div class="${ic}">${badgeIcon(b.icon)}</div>
    <div class="text-[10px] font-600 leading-tight ${b.earned?'text-white':'text-mute'}">${esc(b.name)}</div>
    ${ (!b.earned && b.goal) ? `<div class="w-full h-1 rounded-full bg-line overflow-hidden mt-0.5"><div class="h-full bg-white/50" style="width:${pct}%"></div></div>` : '' }
    ${ b.earned ? `<span class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-white flex items-center justify-center"><svg class="w-3 h-3 text-ink" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" d="m5 13 4 4L19 7"/></svg></span>`:'' }
  </button>`;
}
function badgeInfo(id){
  const b=computeBadges().find(x=>x.id===id); if(!b) return;
  const status = b.earned ? 'Unlocked' : (b.goal ? `${fmtInt(Math.min(b.progress||0,b.goal))} / ${fmtInt(b.goal)}` : 'Locked');
  modal(`<div class="p-6 text-center">
    <div class="mx-auto w-20 h-20 rounded-2xl ${b.earned?'edge-ring':'border border-line'} bg-panel2 flex items-center justify-center ${b.earned?'text-white':'text-mute opacity-50'} mb-3">
      <div class="scale-150">${badgeIcon(b.icon)}</div>
    </div>
    <h3 class="font-display font-700 text-xl">${esc(b.name)}</h3>
    <p class="text-mute text-sm mt-1">${esc(b.desc)}</p>
    <p class="mt-3 font-display font-700 ${b.earned?'edge-text':'text-mute'}">${status}</p>
    <button onclick="closeModal()" class="mt-5 w-full rounded-xl py-3 chip font-semibold btn-press">Close</button>
  </div>`);
}

/* ---------- collapsible sections (nothing on this app scrolls forever) ---------- */
let _openCat={}, _openGrp={}, _catAll={};
function toggleCat(n){ _openCat[n]=!_openCat[n]; refreshBadges(); }
function toggleCatAll(n){ _catAll[n]=!_catAll[n]; refreshBadges(); }
function toggleGrp(n){ _openGrp[n]=!_openGrp[n]; refreshExGroups(); }
function refreshBadges(){ const b=$('#badgeAccordion'); if(b) b.innerHTML=badgeAccordionHtml(); }
function refreshExGroups(){ const b=$('#exGroups'); if(b) b.innerHTML=exGroupsHtml(); }

function sectionHead(open, title, right, act){
  return `<button onclick="${act}" class="w-full flex items-center justify-between gap-2 px-4 py-3 btn-press text-left">
    <span class="font-display font-600 text-sm tracking-[.12em] ${open?'text-white':'text-mute'}">${esc(title)}</span>
    <span class="flex items-center gap-2 shrink-0">
      <span class="text-[11px] font-bold text-mute tabular-nums">${right}</span>
      <svg class="w-4 h-4 text-mute transition-transform ${open?'rotate-180':''}" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>
    </span>
  </button>`;
}
function badgeAccordionHtml(){
  const cats=badgeCategories();
  if(!cats.length) return `<div class="card p-6 text-center text-mute text-sm">Finish a workout to start unlocking milestones.</div>`;
  return cats.map((c,idx)=>{
    const open = _openCat[c.name] !== undefined ? _openCat[c.name] : idx===0;
    const list = _catAll[c.name] ? c.all : c.shown;
    return `<div class="card overflow-hidden">
      ${ sectionHead(open, c.name.toUpperCase(), c.earned+'/'+c.total, `toggleCat('${esc(c.name)}')`) }
      ${ open ? `<div class="px-3 pb-3">
          <div class="grid grid-cols-4 gap-2">${ list.map(badgeTile).join('') }</div>
          ${ c.all.length>c.shown.length ? `<button onclick="toggleCatAll('${esc(c.name)}')" class="w-full text-center text-[11px] font-semibold text-mute mt-2.5 py-1 btn-press">${_catAll[c.name]?'Show fewer':'Show all '+c.all.length+' — including future targets'}</button>`:'' }
        </div>` : '' }
    </div>`;
  }).join('');
}
function exGroupsHtml(){
  const stats=allExerciseStats();
  if(!stats.length) return `<div class="card p-6 text-center text-mute text-sm">Complete a workout to see progress.</div>`;
  const by={};
  stats.forEach(m=>{ (by[m.group]=by[m.group]||[]).push(m); });
  const groups=MUSCLE_ORDER.filter(g=>by[g]);
  return groups.map((g,idx)=>{
    const open = _openGrp[g] !== undefined ? _openGrp[g] : idx===0;
    const list=by[g];
    const sess=list.reduce((a,m)=>a+m.sessions,0);
    return `<div class="card overflow-hidden">
      ${ sectionHead(open, g.toUpperCase(), list.length+' · '+sess+' sess', `toggleGrp('${esc(g)}')`) }
      ${ open ? `<div class="px-3 pb-3 space-y-2">${ list.map(exerciseRow).join('') }</div>` : '' }
    </div>`;
  }).join('');
}

  <!-- Work moved -->

      <h2 class="font-display font-600 text-sm tracking-[.15em] text-mute mb-1">WORK / WEEK (${state.unit})</h2>
      <p class="text-[11px] text-mute mb-1">Bodyweight reps and holds are counted at your body weight.</p>
      <div class="h-40"><canvas id="volWeekChart"></canvas></div>
    </div>

  <div class="px-5 mt-6">
    <h2 class="font-display font-600 text-sm tracking-[.15em] text-mute mb-3">EXERCISES</h2>

function statTile(label,val){
  return `<div class="card p-4">
    <div class="font-display font-700 text-2xl text-white">${val}</div>
    <div class="text-mute text-xs mt-0.5 font-semibold tracking-wide">${label}</div>
  </div>`;
}
/* One row per exercise, phrased in that exercise's own units — a weighted lift
   leads with its 1RM, a bodyweight movement with lifetime reps, a hold with time. */
function exerciseRow(m){
  const prDate = m.type==='weighted' ? m.bestWeightDate : (m.bestSessionDate||m.bestRepsDate);
  const recentPR = prDate && (Date.now()-new Date(prDate+'T00:00:00').getTime() < 21*864e5);
  let sub, big, cap;
  if(m.type==='timed'){
    sub=`${m.sessions} sessions · best ${fmtDur(m.maxHold)} hold`;
    big=fmtDur(m.totalHold); cap='TOTAL TIME';
  } else if(m.type==='bodyweight'){
    sub=`${m.sessions} sessions · best ${m.maxReps} reps · ${m.maxSessionReps} in a session`;
    big=fmtVol(m.totalReps); cap='TOTAL REPS';
  } else {
    sub=`${m.sessions} sessions · best ${Math.round(m.maxWeight)} ${state.unit} × ${m.maxReps} reps`;
    big=Math.round(m.maxOneRm); cap='EST 1RM';
  }
  return `<button data-act="openEx" data-val="${esc(m.name)}" class="btn-press w-full chip rounded-xl p-3 text-left flex items-center justify-between">
    <div class="min-w-0">
      <h3 class="font-display font-600 text-base truncate">${esc(m.name)} ${recentPR?'<span class="text-[10px] font-bold edge-text align-middle ml-1">NEW PR</span>':''}</h3>
      <p class="text-mute text-[11px] mt-0.5 truncate">${esc(sub)}</p>
    </div>
    <div class="text-right shrink-0 ml-3">
      <div class="font-display font-700 text-white">${big}</div>
      <div class="text-[10px] text-mute tracking-widest">${cap}</div>
    </div>
  </button>`;
}

function exLogRow(p,type){
  const pr = p.weightPR||p.repsPR||p.holdPR||p.sessionRepsPR;
  const right = type==='timed'
    ? `<b>${fmtDur(p.maxHold)}</b> best · ${fmtDur(p.hold)} total`
    : type==='bodyweight'
      ? `<b>${p.maxReps}</b> best set · ${p.reps} reps`
      : `<b>${Math.round(p.maxWeight)}</b> ${state.unit} × ${p.maxReps} · ${fmtVol(p.work)} work`;
  return `<div class="chip rounded-xl p-3 flex items-center justify-between text-sm gap-2">
    <span class="text-mute shrink-0">${fmtDate(p.date)} ${pr?'<span class="edge-text font-bold ml-1">PR</span>':''}</span>
    <span class="font-display text-right truncate">${right}</span></div>`;
}
let _exWeightChart=null,_exRepsChart=null,_exVolChart=null;
function drawExerciseChart(){
  const m=allExerciseStats().find(x=>x.name.toLowerCase()===_exName.toLowerCase()); if(!m||!window.Chart) return;
  const labels=m.points.map(p=>fmtDateShort(p.date));
  // weight (edge-yellow line = an outline) with PR points ringed; est 1RM dashed white
  const cv=$('#exWeightChart');
  if(cv){ if(_exWeightChart)_exWeightChart.destroy();
    _exWeightChart=new Chart(cv,{ type:'line',
      data:{ labels, datasets:[
        { label:'Top set', data:m.points.map(p=>Math.round(p.maxWeight)),
          borderColor:'#d8ff4f', backgroundColor:'rgba(255,255,255,.05)', fill:true, tension:.3,
          pointRadius:m.points.map(p=>p.weightPR?5.5:3),
          pointBackgroundColor:m.points.map(p=>p.weightPR?'#0a0a0b':'#ffffff'),
          pointBorderColor:m.points.map(p=>p.weightPR?'#d8ff4f':'#ffffff'),
          pointBorderWidth:m.points.map(p=>p.weightPR?2.5:1) },
        { label:'Est 1RM', data:m.points.map(p=>Math.round(p.oneRm)), borderColor:'rgba(255,255,255,.45)', borderDash:[5,4], fill:false, tension:.3, pointRadius:0 }
      ]}, options:chartOpts(true) });
  }
  // reps line — or hold-time line for timed movements
  const timed = m.type==='timed';
  const cvR=$('#exRepsChart');
  if(cvR){ if(_exRepsChart)_exRepsChart.destroy();
    const series = timed ? m.points.map(p=>p.maxHold) : m.points.map(p=>p.maxReps);
    const flag   = timed ? m.points.map(p=>p.holdPR)  : m.points.map(p=>p.repsPR);
    _exRepsChart=new Chart(cvR,{ type:'line',
      data:{ labels, datasets:[{ label:timed?'Longest hold (s)':'Max reps', data:series,
        borderColor:'#ffffff', backgroundColor:'rgba(255,255,255,.06)', fill:true, tension:.3,
        pointRadius:flag.map(f=>f?5.5:3),
        pointBackgroundColor:flag.map(f=>f?'#0a0a0b':'#ffffff'),
        pointBorderColor:flag.map(f=>f?'#d8ff4f':'#ffffff'),
        pointBorderWidth:flag.map(f=>f?2.5:1) }]},
      options:chartOpts(false) });
  }
  // per-session totals — reps for bodyweight, work for everything else, so a
  // push-up history is no longer a chart of flat zeroes
  const cv2=$('#exVolChart');
  if(cv2){ if(_exVolChart)_exVolChart.destroy();
    const bars = m.type==='bodyweight' ? m.points.map(p=>Math.round(p.reps)) : m.points.map(p=>Math.round(p.work));
    _exVolChart=new Chart(cv2,{ type:'bar',
      data:{ labels, datasets:[{ data:bars, backgroundColor:'rgba(255,255,255,.6)', borderRadius:5, maxBarThickness:22 }]},
      options:chartOpts(false) });
  }
}
function chartOpts(legend){
  return {
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ display:legend, labels:{ color:'#8b8b96', boxWidth:10, font:{size:11} } },
      tooltip:{ backgroundColor:'#1c1c21', borderColor:'#2a2a31', borderWidth:1, titleColor:'#fff', bodyColor:'#ffffff' } },
    scales:{
      x:{ grid:{ display:false }, ticks:{ color:'#6b6b76', font:{size:10}, maxRotation:0, autoSkip:true, maxTicksLimit:6 } },
      y:{ grid:{ color:'rgba(255,255,255,.05)' }, ticks:{ color:'#6b6b76', font:{size:10} }, beginAtZero:true }
    }
  };
}

/* =================================================================
   DATA CHECK — find sessions the numbers say never happened
   -----------------------------------------------------------------
   The July 2026 backend glitch (a deploy without LockService) wrote some set
   rows to the Sheet twice. getData_L groups rows by exercise+order and pushes
   one set PER ROW without de-duplicating, so a doubled 3x8 entry comes back as
   six sets numbered 1,1,2,2,3,3 — silently doubling that session's totals and
   freezing an impossible "best session" record in place.

   A repeated setNumber inside a single exercise is the fingerprint: real sets
   are always numbered 1..n. We split those into two buckets — identical copies
   (safe to remove automatically) and copies whose numbers disagree (a human has
   to look) — and never touch anything on our own.
   ================================================================= */
function dataAnomalies(){
  if(_bestCache.__anom) return _bestCache.__anom;
  const dup=[], conflict=[], stuck=[], outliers=[];
  const today=todayISO();
  state.workouts.forEach(w=>{
    if(w.status==='in_progress' && w.date){
      const age=Math.round((new Date(today+'T00:00:00') - new Date(w.date+'T00:00:00'))/864e5);
      if(age>=14) stuck.push({ workoutId:w.workoutId, date:w.date, name:w.name, age });
    }
    (w.exercises||[]).forEach(e=>{
      const byNum={};
      (e.sets||[]).forEach(s=>{ const n=Number(s.setNumber)||0; (byNum[n]=byNum[n]||[]).push(s); });
      Object.keys(byNum).forEach(n=>{
        const g=byNum[n]; if(g.length<2) return;
        const identical = g.every(s => String(s.weight)===String(g[0].weight)
                                    && String(s.reps)===String(g[0].reps)
                                    && !!s.completed===!!g[0].completed);
        (identical?dup:conflict).push({ workoutId:w.workoutId, date:w.date, name:w.name,
          exercise:e.name, setNumber:Number(n), copies:g.length, reps:g[0].reps, weight:g[0].weight });
      });
    });
  });
  // A rep count far above your own norm for that movement — the symptom you'd notice.
  allExerciseStats().forEach(m=>{
    if(m.type==='weighted' || m.points.length<3) return;
    const vals=m.points.map(p=>p.reps).filter(v=>v>0).sort((a,b)=>a-b);
    if(vals.length<3) return;
    const med=vals[Math.floor(vals.length/2)];
    if(med<=0) return;
    m.points.forEach(p=>{
      if(p.reps>=2*med && p.reps>med+15)
        outliers.push({ workoutId:p.id, date:p.date, exercise:m.name, reps:p.reps, median:med });
    });
  });
  const res={ dup, conflict, stuck, outliers, total:dup.length+conflict.length+stuck.length+outliers.length };
  _bestCache.__anom=res;
  return res;
}
/* Group per workout+exercise so the report reads "sets 1,2,3 logged twice". */
function dupGroups(list){
  const g={};
  list.forEach(d=>{
    const k=d.workoutId+'|'+d.exercise;
    if(!g[k]) g[k]=Object.assign({}, d, {sets:[]});
    g[k].sets.push(d.setNumber);
  });
  return Object.values(g);
}

function findingRow(id, title, detail){
  return `<button onclick="openFinding('${id}')" class="w-full chip rounded-xl p-3 text-left btn-press">
    <div class="font-display font-600 text-sm truncate">${esc(title)}</div>

  </button>`;
