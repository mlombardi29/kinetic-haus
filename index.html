<!-- ============================================================= -->
<!--  KINETIC HAUS — Single-file workout tracker                   -->
<!--  Tech: HTML + Tailwind (CDN) + vanilla JS + Chart.js (CDN)    -->
<!--  Backend: Google Apps Script Web App -> Google Sheet          -->
<!--                                                               -->
<!--  SETUP (non-developer friendly): see SETUP.md in this folder. -->
<!--  Quick version:                                               -->
<!--   1. Create a Google Sheet.                                   -->
<!--   2. Extensions > Apps Script, paste Code.gs, Deploy as Web   -->
<!--      App (Execute as: Me, Who has access: Anyone).            -->
<!--   3. Copy the Web App URL.                                    -->
<!--   4. Open this app, tap the gear (top-right) and paste the    -->
<!--      URL. Done. Data lives in your Sheet.                     -->
<!--                                                               -->
<!--  Works offline / in sandboxes too: if no URL is set (or the   -->
<!--  network/localStorage is blocked) the app keeps everything in -->
<!--  memory + localStorage and never crashes.                     -->
<!-- ============================================================= -->

<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          ink:      '#0a0a0b',   // page background (near black)
          panel:    '#141417',   // raised surfaces
          panel2:   '#1c1c21',   // deeper surfaces / inputs
          line:     '#2a2a31',   // borders
          mute:     '#8b8b96',   // muted text
          volt:     '#ffffff',   // primary "fill" accent — monochrome white
          edge:     '#d8ff4f',   // yellow — OUTLINE / STROKE USE ONLY (never a fill)
        },
        fontFamily: {
          display: ['"Chakra Petch"', 'system-ui', 'sans-serif'],
          sans:    ['Inter', 'system-ui', 'sans-serif'],
        },
        // register numeric weight utilities (font-400 … font-800) used throughout
        fontWeight: { 400:'400', 500:'500', 600:'600', 700:'700', 800:'800' },
      }
    }
  }
</script>

<style>
  /* MONOCHROME brand palette. --volt = white primary fill. --edge = yellow,
     used ONLY as an outline/stroke (focus rings, in-progress border, PR markers,
     chart lines, earned-badge ring) — never as a filled background or text. */
  :root { --volt:#ffffff; --edge:#d8ff4f; }
  html,body{background:#0a0a0b;}
  body{ -webkit-tap-highlight-color:transparent; font-family:Inter,system-ui,sans-serif; color:#f4f4f6; overscroll-behavior-y:none; }
  *{ -webkit-touch-callout:none; }
  ::-webkit-scrollbar{ width:0; height:0; }
  input,select,textarea{ font-size:16px; } /* prevent iOS zoom */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; }

  .safe-bottom{ padding-bottom:calc(env(safe-area-inset-bottom) + 86px); }
  .nav-safe{ padding-bottom:env(safe-area-inset-bottom); }

  .glass{ background:rgba(20,20,23,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); }
  .card{ background:linear-gradient(160deg,#17171b 0%,#101012 100%); border:1px solid #24242b; border-radius:20px; }
  .btn-press{ transition:transform .08s ease, background .15s ease, border-color .15s ease; }
  .btn-press:active{ transform:scale(.97); }

  .volt-glow{ box-shadow:0 0 0 1px rgba(255,255,255,.12), 0 10px 34px -10px rgba(255,255,255,.22); }
  .accent-text{ color:#ffffff; }
  .edge-ring{ box-shadow:0 0 0 1.5px var(--edge); border-color:var(--edge)!important; }
  .edge-text{ color:var(--edge); }

  /* view transitions — opacity only (no transform) so fixed children stay
     anchored to the viewport, not to the animated wrapper */
  .view{ animation:viewfade .25s ease both; }
  @keyframes viewfade{ from{opacity:0;} to{opacity:1;} }
  @keyframes fade{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }

  .pulse-dot{ animation:pulse 1.6s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.35;} }

  /* completed set row (white-tinted, no colour) */
  .set-done{ background:linear-gradient(90deg, rgba(255,255,255,.08), rgba(255,255,255,.02)); border-color:rgba(255,255,255,.38)!important; }

  .chip{ background:#1c1c21; border:1px solid #2a2a31; }
  .field{ background:#1c1c21; border:1px solid #2a2a31; border-radius:14px; }
  .field:focus-within{ border-color:var(--edge); box-shadow:0 0 0 1px var(--edge); }
  textarea.field, input.field, select.field{ outline:none; }

  .toast-in{ animation:toastIn .25s ease both; }
  @keyframes toastIn{ from{opacity:0; transform:translateY(12px);} to{opacity:1; transform:none;} }

  .modal-back{ animation:fade .2s ease both; }
  .sheet{ animation:sheetUp .3s cubic-bezier(.22,1,.36,1) both; }
  @keyframes sheetUp{ from{transform:translateY(100%);} to{transform:none;} }

  .hidden-imp{ display:none!important; }
  .spin{ animation:spin 1s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }
</style>

<script>
/* =================================================================
   KINETIC HAUS  —  app logic

/* ---------- Brand logo ----------------------------------------------------
   The official Kinetic Haus mark: interlocking K+H monogram + dot + wordmark.
   Reproduced here as a white inline SVG so the app stays a single self-contained
   file and the logo scales crisply on any background.

   ► To drop in your EXACT official artwork instead, paste a data-URI (or URL)
     of the white/transparent logo into KH_LOGO_OVERRIDE below — the app will
     use that image verbatim and skip the inline SVG. Nothing else changes. */
const KH_LOGO_OVERRIDE = ''; // e.g. 'data:image/svg+xml;base64,....' or 'assets/logo.svg'

function MONOGRAM(size, color){
  color = color || '#ffffff';
  return `<svg viewBox="0 0 120 200" width="${size}" height="${size*200/120}" fill="${color}" aria-label="Kinetic Haus monogram">
    <path d="M6 8c10 0 14 6 14 16v48c0 12 8 18 18 18v14c-10 0-18 6-18 18v48c0 10-4 16-14 16-2 0-4 0-6-.5v-13c5 0 7-3 7-8v-50c0-12 6-19 15-22-9-3-15-10-15-22V29.5c0-5-2-8-7-8V8.5C2 8 4 8 6 8z"/>
    <rect x="38" y="6" width="13" height="188" rx="6"/>
    <path d="M51 96c14-2 24-12 30-30 3-9 5-18 5-30h13c0 16-3 28-8 40-5 12-13 21-24 26v-6z"/>
    <rect x="69" y="6" width="13" height="188" rx="6"/>
    <rect x="44" y="92" width="44" height="13" rx="5"/>
    <path d="M114 8c-10 0-14 6-14 16v48c0 12-8 18-18 18v14c10 0 18 6 18 18v48c0 10 4 16 14 16 2 0 4 0 6-.5v-13c-5 0-7-3-7-8v-50c0-12-6-19-15-22 9-3 15-10 15-22V29.5c0-5 2-8 7-8V8.5c-2-.5-4-.5-6-.5z"/>
  </svg>`;
}
/* Full horizontal lockup: monogram · KINETIC / HAUS */
function LOGO_LOCKUP(){
  const mark = KH_LOGO_OVERRIDE
    ? `<img src="${KH_LOGO_OVERRIDE}" alt="Kinetic Haus" class="h-9 w-auto"/>`
    : `<div class="flex items-center gap-2.5">
        <div class="w-8 shrink-0">${MONOGRAM(30)}</div>
        <span class="w-1.5 h-1.5 rounded-full bg-white shrink-0"></span>
        <div class="leading-[0.9] font-display font-700 tracking-[.16em] text-white">
          <div class="text-[14px]">KINETIC</div>
          <div class="text-[14px]">HAUS</div>
        </div>
      </div>`;
  return mark;
}
function WORDMARK(){ return LOGO_LOCKUP(); }

/* ---------- Built-in exercise library -------------------------------------
   ~250 of the most common gym + at-home movements, with multiple variations
   where it makes sense (e.g. Bench Press / Incline / Decline / Smith Machine).
   These power the autocomplete in "Add exercise". They live in the background:
   only matching ones surface as you type. Anything you type that isn't here is
   remembered (state.customEx) and suggested next time. */
const EXERCISE_LIB = [
  // ---- Chest ----
  'Bench Press','Incline Bench Press','Decline Bench Press','Close-Grip Bench Press','Smith Machine Bench Press',
  'Dumbbell Press','Incline Dumbbell Press','Decline Dumbbell Press',
  'Dumbbell Flies','Incline Dumbbell Flies','Decline Dumbbell Flies',
  'Cable Fly','Low Cable Fly','High Cable Fly','Pec Deck','Chest Press Machine',
  'Push-Ups','Incline Push-Ups','Decline Push-Ups','Diamond Push-Ups','Wide Push-Ups','Knee Push-Ups','Plyometric Push-Ups',
  'Chest Dips','Svend Press',
  // ---- Back ----
  'Deadlift','Romanian Deadlifts','Sumo Deadlift','Trap Bar Deadlift','Stiff-Leg Deadlift','Single-Leg Deadlift','Deficit Deadlift',
  'Pull-Ups','Wide-Grip Pull-Ups','Neutral-Grip Pull-Ups','Assisted Pull-Ups','Weighted Pull-Ups',
  'Chin-Ups','Assisted Chin-Ups','Weighted Chin-Ups',
  'Lat Pulldown','Wide-Grip Lat Pulldown','Close-Grip Lat Pulldown','Behind-Neck Lat Pulldown',
  'Bent-Over Row','Barbell Row','Dumbbell Row','One-Arm Dumbbell Rows','Pendlay Row','T-Bar Row','Meadows Row',
  'Seated Cable Row','Wide-Grip Seated Row','Inverted Row','Chest-Supported Row','Machine Row',
  'Face Pull','Straight-Arm Pulldown','Reverse Flies','Cable Reverse Fly','Rear Delt Machine Fly',

  // ---- Shoulders ----
  'Overhead Press','Barbell Overhead Press','Dumbbell Shoulder Press','Seated Shoulder Press','Shoulder Press','Machine Shoulder Press',
  'Arnold Presses','Push Press','Landmine Press','Lateral Raises','Cable Lateral Raise','Machine Lateral Raise',
  'Front Raise','Cable Front Raise','Rear Delt Fly','Upright Row','Plate Front Raise',
  // ---- Biceps ----
  'Bicep Curls','Dumbbell Curl','Barbell Curl','Cable Curl','Hammer Curls','Dumbbell Concentration Curls','Preacher Curl',
  'Incline Dumbbell Curl','EZ-Bar Curl','Spider Curl','Zottman Curl','Reverse Curl',
  // ---- Triceps ----
  'Tricep Pushdown','Rope Pushdown','Bar Pushdown','Tricep Kickbacks','Overhead Tricep Extension',
  'Cable Overhead Extension','Dumbbell Overhead Extension','Skull Crushers','Tricep Dips','Bench Dips','Incline Tricep Dips','JM Press',
  // ---- Quads / Legs ----
  'Squats','Back Squat','Front Squat','Goblet Squat','Smith Machine Squat','Hack Squat','Bulgarian Split Squat',
  'Split Squat','Sumo Squat','Box Squat','Pistol Squat','Sissy Squat','Jump Squat',
  'Leg Presses','Single-Leg Press','Lunges','Walking Lunges','Reverse Lunges','Side Lunges','Curtsy Lunges',
  'Leg Extension','Step-Ups','Wall Sit',
  // ---- Hamstrings / Glutes ----
  'Leg Curl','Seated Leg Curl','Lying Leg Curl','Hip Thrust','Barbell Hip Thrust','Single-Leg Hip Thrust',
  'Glute Bridge','Cable Pull-Through','Kettlebell Swing','Nordic Curl','Glute Kickback','Hip Abduction','Hip Adduction',
  // ---- Calves ----
  'Standing Calf Raise','Seated Calf Raise','Single-Leg Calf Raise','Calf Press',
  // ---- Core ----
  'Plank','Side Planks','Plank with Shoulder Taps','Up-Down Plank','Weighted Plank',
  'Crunch','Cable Crunch','Bicycle Crunch','Reverse Crunch','Sit-Ups','Decline Sit-Ups',
  'Leg Raises','Hanging Leg Raise','Lying Leg Raise','Hanging Knee Raise','Russian Twists',
  'Mountain Climbers','Hollow Hold','Dead Bug','Ab Wheel Rollout','Flutter Kicks','V-Ups','Toe Touches',
  'Cable Woodchopper','Pallof Press','Bird Dog','Dragon Flag','Sit-Up Throws',
  // ---- Olympic / Power / Functional ----
  'Power Clean','Hang Clean','Clean and Jerk','Snatch','Dumbbell Snatch','Thruster','Push Jerk',
  'Turkish Get-Up','Kettlebell Clean','Kettlebell Snatch','Wall Ball','Medicine Ball Slam','Devil Press','Man Maker',
  // ---- Conditioning / Movement ----
  'Burpees','Box Jumps','Jumping Jacks','High Knees','Skater Jumps','Battle Ropes','Sled Push','Sled Pull',
  'Farmer’s Carry','Bear Crawl','Tire Flip','Sledgehammer Swing','Jump Rope','Box Step-Overs',
  // ---- Cardio ----
  'Running','Treadmill Run','Sprints','Incline Walk','Rowing (Erg)','Ski Erg','Cycling','Stationary Bike',
  'Assault Bike','Stair Climber','Elliptical','Swimming',
  // ---- Mobility / Stretch ----
  'Hip Flexor Stretch','Hamstring Stretch','Pigeon Pose','Cat-Cow','World’s Greatest Stretch',

/* Frequency map of how often each exercise has been used (from logged workouts +
   the day templates) so the most-used names float to the top of suggestions. */
function exerciseFreq(){
  const f={};
  const bump=(n,by)=>{ const k=n.toLowerCase(); f[k]=(f[k]||0)+by; };
  state.workouts.forEach(w=>(w.exercises||[]).forEach(e=>bump(e.name,2)));
  if(state.active) state.active.exercises.forEach(e=>bump(e.name,2));
  Object.values(state.days).forEach(d=>d.exercises.forEach(e=>bump(e.name,1)));
  return f;
}
/* Master de-duplicated list: library ∪ custom ∪ history ∪ templates. */
function allKnownExercises(){
  const seen=new Set(), out=[];
  const add=n=>{ const k=n.toLowerCase(); if(k && !seen.has(k)){ seen.add(k); out.push(n); } };
  state.customEx.forEach(add);
  state.workouts.forEach(w=>(w.exercises||[]).forEach(e=>add(e.name)));
  Object.values(state.days).forEach(d=>d.exercises.forEach(e=>add(e.name)));
  EXERCISE_LIB.forEach(add);
  return out;
}
function isKnownExercise(name){
  const k=name.trim().toLowerCase();
  return allKnownExercises().some(n=>n.toLowerCase()===k);
}
/* Ranked suggestions for a query. Empty query => most-used first. */
function suggestExercises(query, limit=40){
  const q=(query||'').trim().toLowerCase();
  const freq=exerciseFreq();
  let list=allKnownExercises();
  if(q) list=list.filter(n=>n.toLowerCase().includes(q));
  list.sort((a,b)=>{
    const fa=freq[a.toLowerCase()]||0, fb=freq[b.toLowerCase()]||0;
    if(fb!==fa) return fb-fa;                                   // most used first
    if(q){ const sa=a.toLowerCase().startsWith(q)?0:1, sb=b.toLowerCase().startsWith(q)?0:1; if(sa!==sb) return sa-sb; }
    return a.localeCompare(b);
  });
  return list.slice(0,limit);
}

/* ---------- exercise type: weighted | bodyweight | timed --------------------
   Decides which inputs to show. Explicit equipment words force 'weighted'
   (e.g. "Weighted Pull-Ups", "Dumbbell Lunges"). Static holds & cardio are
   'timed' (seconds). Calisthenics are 'bodyweight' (reps only, no weight). */
/* Effective type for an exercise instance: a per-exercise user override (set
   via the ⋯ menu, remembered globally by name) wins over the auto-detection. */
function effectiveType(e){
  if(!e) return 'weighted';
  if(e.type) return e.type;
  const pref = state.typePrefs[(e.name||'').toLowerCase()];
  return pref || exerciseType(e.name);
}
function exerciseType(name){
  const n=(name||'').toLowerCase();
  if(/\b(barbell|dumbbell|cable|machine|smith|ez-?bar|kettlebell|trap bar|goblet|plate|weighted|landmine)\b/.test(n)) return 'weighted';
  if(/(plank|wall sit|hollow|dead hang|\bhang\b|mountain climb|high knee|battle rope|jump rope|bear crawl|farmer|superman|jumping jack|wall ball|sprint|running|\brun\b|jog|cycl|\bbike\b|erg|elliptical|stair|swim|incline walk|skater|flutter)/.test(n)) return 'timed';
  if(/(push-?up|pull-?up|chin-?up|\bdips?\b|sit-?up|crunch|leg raise|russian twist|lunge|burpee|v-?up|toe touch|bird dog|dead bug|glute bridge|pistol|sissy|air squat|step-?up|knee raise)/.test(n)) return 'bodyweight';
  return 'weighted';
}
/* Most recent historical values for an exercise (for the greyed placeholder hint). */
function lastUsed(name){
  const k=(name||'').toLowerCase();
  const ws=state.workouts.filter(w=>w.status==='completed' && (!state.active||w.workoutId!==state.active.workoutId))
    .slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.updatedAt||0)-(a.updatedAt||0));
  for(const w of ws){
    const e=(w.exercises||[]).find(x=>x.name.toLowerCase()===k);
    if(e && e.sets.length){
      let best=null;
      e.sets.forEach(s=>{ if(s.completed){ if(!best || num(s.weight)>num(best.weight)) best=s; } });
      if(!best) best=e.sets[e.sets.length-1];
      if(best && (num(best.weight)>0||num(best.reps)>0)) return { weight:best.weight, reps:best.reps };
    }
  }
  return null;
}
/* Best historical record for PR detection (excludes the in-progress workout). */
function exerciseBest(name, excludeId){
  const k=(name||'').toLowerCase(); let mw=0, mr=0;
  state.workouts.filter(w=>w.status==='completed' && w.workoutId!==excludeId).forEach(w=>{
    (w.exercises||[]).forEach(e=>{ if(e.name.toLowerCase()!==k) return;
      e.sets.forEach(s=>{ if(!s.completed) return; mw=Math.max(mw,num(s.weight)); mr=Math.max(mr,num(s.reps)); }); });
  });
  return { weight:mw, reps:mr };
}
function fmtSetHint(type,w,r){
  if(type==='timed') return (num(r)||0)+'s';
  if(type==='bodyweight') return (num(r)||0)+' reps';
  return (num(w)||0)+' '+state.unit+' × '+(num(r)||0);
}
function collapsedHint(e,type){
  let s=null; e.sets.forEach(x=>{ if(num(x.weight)>0||num(x.reps)>0){ if(!s||num(x.weight)>num(s.weight)||(num(x.weight)===num(s.weight)&&num(x.reps)>num(s.reps))) s=x; } });
  if(s) return fmtSetHint(type, s.weight, s.reps);
  const lu=lastUsed(e.name); if(lu) return 'last '+fmtSetHint(type, lu.weight, lu.reps);
  return '';
}

function pick(arr){ return arr[Math.floor((Date.now()/1000+arr.length*Math.random()))%arr.length]; }
function showCoachingNote(){
  const t=pick(COACH_TACTICAL), m=pick(COACH_MOTIVATION);
  modal(`<div class="p-6 text-center">

const Store = (() => {
  let ok = true, mem = {};
  try { const k='__kh_test'; localStorage.setItem(k,'1'); localStorage.removeItem(k); }
  catch(e){ ok = false; }
  return {
    get(k){ try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
    set(k,v){ try { ok ? localStorage.setItem(k,v) : (mem[k]=v); } catch(e){ mem[k]=v; } },
    del(k){ try { ok ? localStorage.removeItem(k) : (delete mem[k]); } catch(e){ delete mem[k]; } },
  };
})();

/* ---------- API layer ----------------------------------------------------
   Works in TWO modes automatically:
   • Hosted INSIDE Apps Script (served by Code.gs)  -> uses google.script.run
   • Standalone file / hosted elsewhere             -> uses fetch() to apiUrl  */
function inGAS(){ return typeof google!=='undefined' && !!(google.script && google.script.run); }
function gasRun(fn){
  const args=[].slice.call(arguments,1);
  return new Promise((resolve,reject)=>{
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn].apply(null,args);
  });
}
async function apiGet(){
  if(state.gas) return await gasRun('getData');
  if(!state.apiUrl) return null;
  const r = await fetch(state.apiUrl + '?action=getData', { method:'GET' });
  if(!r.ok) throw new Error('GET '+r.status);
  return await r.json();
}
async function apiPost(action, payload){
  payload = payload || {};
  if(state.gas){
    switch(action){
      case 'saveWorkout':   return await gasRun('saveWorkout', payload.workout);
      case 'deleteWorkout': return await gasRun('deleteWorkout', payload.workoutId);
      case 'saveDay':       return await gasRun('saveDay', payload.day, payload.oldName||'');
      case 'deleteDay':     return await gasRun('deleteDay', payload.name);
      case 'saveSettings':  return await gasRun('saveSettings', payload.settings);
      default:              return await gasRun('getData');
    }
  }
  if(!state.apiUrl) return { ok:false, offline:true };
  // text/plain avoids a CORS preflight that Apps Script can't answer
  const r = await fetch(state.apiUrl, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ action, ...payload })
  });
  if(!r.ok) throw new Error('POST '+r.status);
  return await r.json();
}

/* ---------- persistence helpers ---------- */
function cacheSave(){
  Store.set(KEY.cache, JSON.stringify({ days:state.days, workouts:state.workouts, unit:state.unit }));
}
function cacheLoad(){
  try{
    const c = JSON.parse(Store.get(KEY.cache)||'{}');
    if(c.days) state.days = c.days;
    if(c.workouts) state.workouts = c.workouts;

  }catch(e){}

  try{ state.typePrefs = JSON.parse(Store.get(KEY.tp)||'{}'); }catch(e){ state.typePrefs={}; }
}

function saveTypePrefs(){

let saveTimer=null, saveQueue=new Set(), _flushing=false;
function queueSaveWorkout(w){
  // optimistic local update
  const i = state.workouts.findIndex(x=>x.workoutId===w.workoutId);
  if(i>=0) state.workouts[i]=w; else state.workouts.unshift(w);
  cacheSave();
  saveQueue.add(w.workoutId);
  setSaveFlag('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSaves, 700);
}
async function flushSaves(){
  if(!state.apiUrl && !state.gas){ setSaveFlag('local'); return; }   // device-only
  if(_flushing){ clearTimeout(saveTimer); saveTimer=setTimeout(flushSaves,250); return; }  // never overlap saves
  _flushing=true;
  try{
    while(saveQueue.size){                       // drain fully so late edits still get saved
      const ids=[...saveQueue]; saveQueue.clear();
      for(const id of ids){
        const w = state.workouts.find(x=>x.workoutId===id);
        if(w) await apiPost('saveWorkout', { workout:w });
      }
    }
    setSaveFlag('saved');
  }catch(e){ setSaveFlag('local'); }
  finally{ _flushing=false; }
}
function setSaveFlag(s){
  const el=$('#saveFlag'); if(!el) return;
  const map={ saving:['Saving…','text-mute'], saved:['Saved','accent-text'], local:['Saved on device','text-mute'] };
  const [t,c]=map[s]||['',''];
  el.className='text-[11px] font-semibold '+c;
  el.textContent=t;
}

/* =================================================================
   BOOT
   ================================================================= */
async function boot(){
  cacheLoad();
  bindNav();
  bindDelegation();
  // flush any pending save the moment the screen sleeps / app backgrounds
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) flushSaves(); });
  window.addEventListener('pagehide',()=>{ flushSaves(); });
  state.loading=true;
  render();              // paint from cache instantly (shows "Reconnecting…" if empty)
  state.gas = await waitForGAS();   // wait for Apps Script bridge before deciding we're offline
  if(state.apiUrl || state.gas){
    const res = await apiGetRetry(4);
    state.loading=false;
    if(res.ok){
      applyCloud(res.data);
      state.loadFailed=false;
      // brand-new empty sheet → seed the 4 default days once (and push them)
      if(!state.workouts.length && !Object.keys(state.days).length && !Store.get(KEY.seeded)) seedExampleDays(true);
    } else {
      state.loadFailed=true;
      state.loadErr = res.err ? String(res.err && res.err.message || res.err) : 'Could not reach the Sheet';
    }
    render();
  } else {
    state.loading=false;
    // first run, device-only: seed the 4 default days once
    if(!state.workouts.length && !Object.keys(state.days).length && !Store.get(KEY.seeded)) seedExampleDays(false);
    render();
  }
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
/* Wait for Google's google.script bridge (Apps-Script-hosted mode). If the
   `google` object never appears we're a standalone file, so stop early. */
async function waitForGAS(maxMs=6000){
  const start=Date.now();
  while(Date.now()-start<maxMs){
    if(typeof google!=='undefined' && google.script && google.script.run) return true;
    if(typeof google==='undefined' && Date.now()-start>900) return false;
    await sleep(120);
  }
  return typeof google!=='undefined' && !!(google.script && google.script.run);
}
async function apiGetRetry(tries=4){
  let lastErr=null;
  for(let i=0;i<tries;i++){
    try{ const d=await apiGet(); if(d===null || (d && d.ok)) return { ok:true, data:d }; lastErr=new Error(d&&d.error||'bad response'); }
    catch(e){ lastErr=e; }
    await sleep(500*(i+1));
  }
  return { ok:false, err:lastErr };
}
async function retryConnect(){
  state.loading=true; state.loadFailed=false; render();
  state.gas = await waitForGAS();
  const res = await apiGetRetry(4);
  state.loading=false;
  if(res.ok){ applyCloud(res.data); state.loadFailed=false; }
  else { state.loadFailed=true; state.loadErr = res.err ? String(res.err && res.err.message || res.err) : 'Could not reach the Sheet'; }
  render();
}
function pushAllDays(){
  if(!(state.apiUrl||state.gas)) return;
  Object.values(state.days).forEach(d=>{ apiPost('saveDay',{ day:d, oldName:'' }).catch(()=>{}); });
}
function pushAllWorkouts(){
  if(!(state.apiUrl||state.gas)) return;
  state.workouts.forEach(w=>{ apiPost('saveWorkout',{ workout:w }).catch(()=>{}); });
}
/* Merge a cloud snapshot WITHOUT ever destroying local data:
   if the cloud comes back empty (slow/failed write, fresh tab) we keep what we
   have and re-push it, so toggling units / re-syncing can never wipe your days. */
function applyCloud(data, pullUnit=true){
  if(!data || !data.ok) return;
  state.online=true;
  const cDays=data.days||{}, cW=data.workouts||[];
  if(Object.keys(cDays).length){ state.days=cDays; }
  else if(Object.keys(state.days).length){ pushAllDays(); }   // cloud empty, we have local -> restore upward
  if(cW.length){ state.workouts=cW.sort(sortWorkouts); }
  else if(state.workouts.length){ pushAllWorkouts(); }        // cloud empty, we have local -> restore upward
  if(pullUnit && data.settings && data.settings.unit){ state.unit=data.settings.unit; Store.set(KEY.unit,state.unit); }
  if(data.settings && data.settings.typePrefs){ try{ state.typePrefs=JSON.parse(data.settings.typePrefs)||{}; Store.set(KEY.tp,JSON.stringify(state.typePrefs)); }catch(e){} }
  cacheSave();
}
function sortWorkouts(a,b){
  const ip = (a.status==='in_progress')?1:0, ip2=(b.status==='in_progress')?1:0;
  if(ip!==ip2) return ip2-ip;            // in-progress first
  return (b.date||'').localeCompare(a.date||'') || (b.updatedAt||0)-(a.updatedAt||0);
}
function mkDay(name, list){ // list = ["Exercise:sets", ...]  (sets default 3)
  return { name, exercises:list.map((s,i)=>{ const [n,st]=s.split(':'); return {name:n, sets:st?+st:3, order:i}; }) };
}

function render(){
  const app=$('#app');

  // Connection guard: if we're cloud-backed but have nothing loaded yet, show a
  // clear reconnect state instead of a misleading "empty" home.
  const empty = !Object.keys(state.days).length && !state.workouts.length;
  if((state.apiUrl||state.gas) && empty && (state.loading||state.loadFailed) && state.view!=='logger'){
    app.innerHTML = `<div class="view safe-bottom">${viewReconnect()}</div>`;
    $('#bottomNav').classList.remove('hidden-imp'); setActiveNav();

  }
  switch(state.view){
    case 'home':     html=viewHome(); break;
    case 'logger':   html=viewLogger(); break;
    case 'history':  html=viewHistory(); break;
    case 'progress': html=viewProgress(); break;

  app.innerHTML = `<div class="view safe-bottom">${html}</div>`;

function startFreeForm(){
  state.active = { workoutId:uid(), date:todayISO(), name:'Free Form', status:'in_progress', notes:'', exercises:[], updatedAt:Date.now() };
  queueSaveWorkout(state.active);
  go('logger');
  showCoachingNote();
}
function startFromDay(name){
  const d=state.days[name]; if(!d) return;
  const exercises=(d.exercises||[]).slice().sort((a,b)=>a.order-b.order).map((e,i)=>({
    name:e.name, order:i, notes:'', collapsed:true,   // start collapsed so all 7 names fit on one screen
    sets:Array.from({length:Math.max(1,e.sets||1)},(_,k)=>({setNumber:k+1,weight:'',reps:'',unit:state.unit,completed:false}))
  }));
  state.active={ workoutId:uid(), date:todayISO(), name:d.name, status:'in_progress', notes:'', exercises, updatedAt:Date.now() };
  queueSaveWorkout(state.active);
  go('logger');
  showCoachingNote();
}
function resumeWorkout(id){
  const w=state.workouts.find(x=>x.workoutId===id); if(!w) return;
  state.active=structuredClone(w); go('logger');
}
function editWorkout(id){
  const w=state.workouts.find(x=>x.workoutId===id); if(!w) return;
  state.active=structuredClone(w); go('logger');
}

      <span class="text-mute"><b id="statVol" class="accent-text font-display">${fmtVol(workoutVolume(w))}</b> ${state.unit}</span>

    <div class="mt-2 flex items-center gap-2">

function exerciseCard(e,i){
  const type=effectiveType(e);
  const done=e.sets.filter(s=>s.completed).length, tot=e.sets.length;
  const allDone = tot>0 && done===tot;

  if(e.collapsed){
    const hint=collapsedHint(e,type);
    return `<div class="card p-3" data-ex="${i}">
      <button onclick="toggleCollapse(${i})" class="w-full flex items-center justify-between gap-2 text-left">
        <div class="min-w-0">
          <div class="font-display font-700 text-base truncate">${esc(e.name)}</div>
          <div class="text-[11px] text-mute mt-0.5">${done}/${tot} sets${hint?' · '+esc(hint):''}</div>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          ${allDone?`<span class="w-5 h-5 rounded-full bg-white flex items-center justify-center"><svg class="w-3.5 h-3.5 text-ink" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" d="m5 13 4 4L19 7"/></svg></span>`:''}
          <svg class="w-5 h-5 text-mute" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg>
        </div>
      </button>
    </div>`;
  }

  const cols = type==='weighted' ? 'grid-cols-[28px_1fr_1fr_44px]' : 'grid-cols-[28px_1fr_44px]';
  const head = type==='weighted'
    ? `<div class="text-center">SET</div><div class="text-center">${state.unit.toUpperCase()}</div><div class="text-center">REPS</div><div class="text-center">✓</div>`
    : type==='timed'
      ? `<div class="text-center">SET</div><div class="text-center">SEC</div><div class="text-center">✓</div>`
      : `<div class="text-center">SET</div><div class="text-center">REPS</div><div class="text-center">✓</div>`;
  return `<div class="card p-3" data-ex="${i}">
    <div class="flex items-center justify-between gap-2">
      <button onclick="toggleCollapse(${i})" class="flex items-center gap-1.5 min-w-0 text-left">
        <svg class="w-4 h-4 text-mute shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m18 15-6-6-6 6"/></svg>
        <span class="font-display font-700 text-base truncate">${esc(e.name)}</span>
      </button>
      <button onclick="exMenu(${i})" class="w-8 h-8 -my-1 rounded-full chip btn-press flex items-center justify-center text-mute shrink-0">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
      </button>
    </div>

    <div class="grid ${cols} gap-2 mt-2 px-1 text-[9px] font-bold tracking-widest text-mute">${head}</div>
    <div class="space-y-1.5 mt-1" data-sets="${i}">
      ${ e.sets.map((s,j)=>setRow(i,j,s,type)).join('') }
    </div>

    <div class="flex gap-2 mt-2">
      <button onclick="addSet(${i})" class="btn-press flex-1 rounded-lg py-2 chip text-xs font-bold tracking-wide text-mute">+ SET</button>
      <button onclick="exNote(${i})" class="btn-press rounded-lg py-2 px-3 chip text-xs font-bold tracking-wide ${e.notes?'text-white':'text-mute'}">NOTE</button>
    </div>
    ${ e.notes ? `<p class="text-xs text-mute mt-1.5 italic px-1">“${esc(e.notes)}”</p>`:'' }
  </div>`;
}
function setRow(i,j,s,type){
  type = type || effectiveType(state.active.exercises[i]);
  const lu = lastUsed(state.active.exercises[i].name);
  const wph = lu && num(lu.weight)>0 ? String(num(lu.weight)) : '0';
  const rph = lu && num(lu.reps)>0 ? String(num(lu.reps)) : '0';
  const setno=`<div class="text-center font-display font-700 text-sm text-mute">${j+1}</div>`;
  const check=`<button onclick="toggleSet(${i},${j})" class="mx-auto w-8 h-8 rounded-lg btn-press flex items-center justify-center ${s.completed?'':'chip'}" style="${s.completed?'background:var(--volt)':''}">
      <svg class="w-5 h-5 ${s.completed?'text-ink':'text-mute'}" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m5 13 4 4L19 7"/></svg>
    </button>`;
  if(type==='weighted'){
    return `<div class="grid grid-cols-[28px_1fr_1fr_44px] gap-2 items-center rounded-lg border border-line p-1 ${s.completed?'set-done':''}" data-row="${i}-${j}">
      ${setno}
      <input type="number" inputmode="decimal" value="${s.weight}" placeholder="${wph}"
        oninput="onSet(${i},${j},'weight',this.value)" class="bg-transparent text-center font-display font-600 text-base py-1.5 w-full outline-none placeholder:text-mute placeholder:opacity-60" />
      <input type="number" inputmode="numeric" value="${s.reps}" placeholder="${rph}"
        oninput="onSet(${i},${j},'reps',this.value)" class="bg-transparent text-center font-display font-600 text-base py-1.5 w-full outline-none placeholder:text-mute placeholder:opacity-60" />
      ${check}
    </div>`;
  }
  return `<div class="grid grid-cols-[28px_1fr_44px] gap-2 items-center rounded-lg border border-line p-1 ${s.completed?'set-done':''}" data-row="${i}-${j}">
    ${setno}
    <input type="number" inputmode="numeric" value="${s.reps}" placeholder="${rph}"
      oninput="onSet(${i},${j},'reps',this.value)" class="bg-transparent text-center font-display font-600 text-base py-1.5 w-full outline-none placeholder:text-mute placeholder:opacity-60" />
    ${check}
  </div>`;
}
function toggleCollapse(i){ const w=state.active; w.exercises[i].collapsed=!w.exercises[i].collapsed; refreshExList(); touch(); }

/* logger wiring (focus-safe: structural changes only re-render parts) */
function wireLogger(){
  const w=state.active; if(!w) return;
  const nm=$('#woName'); if(nm) nm.addEventListener('input',()=>{ w.name=nm.value; touch(); });
  const nt=$('#woNotes'); if(nt) nt.addEventListener('input',()=>{ w.notes=nt.value; touch(); });
}
function touch(){ const w=state.active; if(!w) return; w.updatedAt=Date.now(); queueSaveWorkout(w); }
function refreshStats(){
  const w=state.active; if(!w) return;
  const setsBox=$('#statSets')?.parentElement;   // the "<b>done</b>/total sets" span
  if(setsBox) setsBox.innerHTML = `<b id="statSets" class="text-white font-display">${workoutSetsDone(w)}</b>/${workoutSetsTotal(w)} sets`;
  const vol=$('#statVol'); if(vol) vol.textContent=fmtVol(workoutVolume(w));
  const tot=workoutSetsTotal(w), pct=tot?Math.round(100*workoutSetsDone(w)/tot):0;
  const bar=$('#woProgress'); if(bar) bar.style.width=pct+'%';
  const pl=$('#woPct'); if(pl) pl.textContent=pct+'%';
}
function onSet(i,j,field,val){
  const w=state.active; w.exercises[i].sets[j][field]=val; refreshStats(); touch();
}
function toggleSet(i,j){
  const w=state.active; const e=w.exercises[i]; const s=e.sets[j];
  s.completed=!s.completed;
  if(s.completed){
    const type=effectiveType(e);
    if(type==='weighted' && s.weight==='') s.weight='0';
    if(s.reps==='') s.reps='0';
    if(navigator.vibrate) navigator.vibrate(8);
    checkPR(i,j,type);
  }
  refreshSets(i); refreshStats(); touch();
}
function checkPR(i,j,type){
  const w=state.active; const e=w.exercises[i]; const s=e.sets[j];
  const best=exerciseBest(e.name, w.workoutId);
  w._prShown = w._prShown || {};
  const wt=num(s.weight), rp=num(s.reps);
  if(type==='weighted'){
    if(wt>0 && best.weight>0 && wt>best.weight && !w._prShown[e.name+'|w']){ w._prShown[e.name+'|w']=1; celebratePR(e.name, wt+' '+state.unit+' × '+rp); }
  } else if(type==='timed'){
    if(rp>0 && best.reps>0 && rp>best.reps && !w._prShown[e.name+'|t']){ w._prShown[e.name+'|t']=1; celebratePR(e.name, rp+'s hold'); }
  } else {
    if(rp>0 && best.reps>0 && rp>best.reps && !w._prShown[e.name+'|r']){ w._prShown[e.name+'|r']=1; celebratePR(e.name, rp+' reps'); }
  }
}
function addSet(i){
  const w=state.active; const e=w.exercises[i];
  const last=e.sets[e.sets.length-1]||{};
  e.sets.push({setNumber:e.sets.length+1, weight:last.weight||'', reps:last.reps||'', unit:state.unit, completed:false});
  refreshSets(i); refreshStats(); touch();
}
function removeSet(i,j){
  const w=state.active; w.exercises[i].sets.splice(j,1);
  w.exercises[i].sets.forEach((s,k)=>s.setNumber=k+1);
  refreshSets(i); refreshStats(); touch();
}
function refreshSets(i){
  const w=state.active; const cont=$(`[data-sets="${i}"]`); if(!cont) return;
  cont.innerHTML = w.exercises[i].sets.map((s,j)=>setRow(i,j,s)).join('');
}
function refreshExList(){
  const w=state.active; const list=$('#exList'); if(!list) return;
  list.innerHTML = w.exercises.map((e,i)=>exerciseCard(e,i)).join('');
  refreshStats();
}

function exMenu(i){
  const w=state.active; const e=w.exercises[i];
  modal(`
    <div class="p-2">
      <div class="px-3 py-3 font-display font-700 text-lg">${esc(e.name)}</div>
      ${ exTypeRow(i, effectiveType(e)) }
      <div class="h-px bg-line mx-3 my-1"></div>
      ${ i>0 ? menuItem('Move up','M5 15l7-7 7 7',`moveEx(${i},-1)`):'' }
      ${ i<w.exercises.length-1 ? menuItem('Move down','M19 9l-7 7-7-7',`moveEx(${i},1)`):'' }
      ${ menuItem('Add a set','M12 5v14M5 12h14',`closeModal();addSet(${i})`) }
      ${ e.sets.length>1 ? menuItem('Remove last set','M5 12h14',`closeModal();removeSet(${i},${e.sets.length-1})`):'' }
      ${ menuItem('Edit note','M11 5h6M5 19h14M4 15l9-9 4 4-9 9H4z',`closeModal();exNote(${i})`) }
      ${ menuItemDanger('Remove exercise','M6 7h12M9 7V5h6v2M7 7l1 13h8l1-13',`closeModal();removeEx(${i})`) }
    </div>`,'sheet');
}
function exTypeRow(i, cur){
  const opt=(t,label)=>`<button onclick="setExType(${i},'${t}')" class="flex-1 rounded-lg py-2.5 text-[11px] font-bold tracking-wide btn-press ${cur===t?'text-ink':'chip text-mute'}" style="${cur===t?'background:var(--volt)':''}">${label}</button>`;
  return `<div class="px-3 pt-1 pb-1">
    <div class="text-[10px] font-bold tracking-widest text-mute mb-1.5">INPUTS · how this exercise is logged</div>
    <div class="flex gap-1.5">${opt('weighted',state.unit.toUpperCase()+' + REPS')}${opt('bodyweight','REPS ONLY')}${opt('timed','TIME (S)')}</div>
  </div>`;
}
function setExType(i,t){
  const w=state.active; const e=w.exercises[i];
  e.type=t;
  if(e.name) state.typePrefs[e.name.toLowerCase()]=t;   // remember for next time, everywhere
  saveTypePrefs();
  closeModal(); refreshExList(); touch();
  toast(t==='weighted'?'Weight added':t==='timed'?'Now timed':'Bodyweight only');
}
function menuItem(label,d,act){
  return `<button onclick="${act}" class="w-full flex items-center gap-3 px-3 py-3.5 rounded-xl btn-press hover:bg-panel2 text-left">
    <svg class="w-5 h-5 text-mute" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${d}"/></svg>
    <span class="font-semibold">${label}</span></button>`;
}
function menuItemDanger(label,d,act){
  return `<button onclick="${act}" class="w-full flex items-center gap-3 px-3 py-3.5 rounded-xl btn-press hover:bg-panel2 text-left text-red-400">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${d}"/></svg>
    <span class="font-semibold">${label}</span></button>`;
}
function moveEx(i,dir){ const w=state.active; const j=i+dir; if(j<0||j>=w.exercises.length) return;
  [w.exercises[i],w.exercises[j]]=[w.exercises[j],w.exercises[i]];
  w.exercises.forEach((e,k)=>e.order=k); closeModal(); refreshExList(); touch();
}
function removeEx(i){ const w=state.active; w.exercises.splice(i,1); refreshExList(); touch(); }
function exNote(i){
  const w=state.active; const e=w.exercises[i];
  modal(`<div class="p-5">
    <h3 class="font-display font-700 text-xl mb-3">${esc(e.name)} — note</h3>
    <textarea id="exNoteTa" rows="3" class="field w-full p-3 text-sm" placeholder="e.g. felt strong, increase next time">${esc(e.notes||'')}</textarea>
    <div class="grid grid-cols-2 gap-3 mt-4">
      <button onclick="closeModal()" class="rounded-xl py-3 chip font-semibold btn-press">Cancel</button>
      <button onclick="saveExNote(${i})" class="rounded-xl py-3 font-bold text-ink btn-press" style="background:var(--volt)">Save</button>
    </div></div>`);
  setTimeout(()=>$('#exNoteTa')?.focus(),50);
}
function saveExNote(i){ const w=state.active; w.exercises[i].notes=$('#exNoteTa').value.trim(); closeModal(); refreshExList(); touch(); }

function openAddExercise(){
  _newExSets=3;

function allExerciseStats(src){
  const map={};
  (src || state.workouts.filter(w=>w.status==='completed')).forEach(w=>{
    (w.exercises||[]).forEach(e=>{
      const k=e.name.toLowerCase();
      if(!map[k]) map[k]={ name:e.name, sessions:0, maxWeight:0, maxReps:0, maxOneRm:0, totalVolume:0, points:[], bestWeightDate:'', bestRepsDate:'' };
      const m=map[k]; m.sessions++;
      let sessVol=0, sessMaxW=0, sessMaxR=0, sessRm=0;
      e.sets.forEach(s=>{ if(!s.completed) return; const wt=num(s.weight), rp=num(s.reps);
        sessVol+=wt*rp; if(wt>sessMaxW) sessMaxW=wt; if(rp>sessMaxR) sessMaxR=rp;
        const rm=wt*(1+rp/30); if(rm>sessRm) sessRm=rm; });
      m.totalVolume+=sessVol;
      m.points.push({date:w.date, volume:sessVol, maxWeight:sessMaxW, maxReps:sessMaxR, oneRm:sessRm});
    });
  });
  Object.values(map).forEach(m=>{
    m.points.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    let rw=0, rr=0;                                  // running maxima -> PR flags
    m.points.forEach(p=>{
      p.weightPR = p.maxWeight>rw && p.maxWeight>0; if(p.weightPR){ rw=p.maxWeight; m.bestWeightDate=p.date; }
      p.repsPR   = p.maxReps>rr   && p.maxReps>0;   if(p.repsPR){   rr=p.maxReps;   m.bestRepsDate=p.date; }
    });
    m.maxWeight=rw; m.maxReps=rr; m.maxOneRm=Math.max(0,...m.points.map(p=>p.oneRm));
  });
  return Object.values(map).sort((a,b)=>b.sessions-a.sessions);
}

/* ---------- time helpers for weekly charts / streaks / badges ---------- */
function weekStartDate(iso){ const d=new Date(iso+'T00:00:00'); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off); return d; } // Monday
function weekKey(iso){ return weekStartDate(iso).toISOString().slice(0,10); }
function tfCutoff(tf){ const days={'6w':42,'12w':84,'26w':182}[tf]; if(days==null) return null; const d=new Date(); d.setDate(d.getDate()-days); return d.toISOString().slice(0,10); }
function weeklySeries(tf){
  const done=state.workouts.filter(w=>w.status==='completed' && w.date);
  if(!done.length) return { labels:[], counts:[], volumes:[] };
  const cut=tfCutoff(tf);
  const startIso = cut || done.reduce((m,w)=> w.date<m?w.date:m, done[0].date);
  let cur=weekStartDate(startIso); const end=weekStartDate(todayISO());
  const buckets=[], idx={};
  while(cur<=end && buckets.length<80){ const k=cur.toISOString().slice(0,10); idx[k]=buckets.length; buckets.push({k,count:0,vol:0}); cur.setDate(cur.getDate()+7); }
  done.forEach(w=>{ if(cut && w.date<cut) return; const i=idx[weekKey(w.date)]; if(i!=null){ buckets[i].count++; buckets[i].vol+=workoutVolume(w); } });
  return {
    labels: buckets.map(b=>new Date(b.k+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'})),
    counts: buckets.map(b=>b.count),
    volumes: buckets.map(b=>Math.round(b.vol)),
  };
}
function weekStreak(){
  const wk=new Set(state.workouts.filter(w=>w.status==='completed'&&w.date).map(w=>weekKey(w.date)));
  let cur=weekStartDate(todayISO()), streak=0;
  if(!wk.has(cur.toISOString().slice(0,10))) cur.setDate(cur.getDate()-7); // grace: current week not done yet
  while(wk.has(cur.toISOString().slice(0,10))){ streak++; cur.setDate(cur.getDate()-7); }
  return streak;
}

    mountain:'M3 19l6-10 3.5 5.5L15 11l6 8z',
  };

}
function longestDayStreak(dateSet){
  const days=[...dateSet].filter(Boolean).sort();
  let best=0,cur=0,prev=null;
  days.forEach(d=>{ const t=new Date(d+'T00:00:00').getTime();
    if(prev!=null && Math.round((t-prev)/864e5)===1) cur++; else cur=1;
    if(cur>best) best=cur; prev=t; });
  return best;
}
function longestWeekRun(weekKeys){
  const arr=[...new Set(weekKeys)].filter(Boolean).sort();
  let best=0,cur=0,prev=null;
  arr.forEach(k=>{ const t=new Date(k+'T00:00:00').getTime();
    if(prev!=null && Math.round((t-prev)/(7*864e5))===1) cur++; else cur=1;
    if(cur>best) best=cur; prev=t; });
  return best;
}
function weekStreakMin(ws,min){ const wk={}; ws.forEach(w=>{ const k=weekKey(w.date); wk[k]=(wk[k]||0)+1; });
  return longestWeekRun(Object.keys(wk).filter(k=>wk[k]>=min)); }

    {id:'wk8',      icon:'flame',   name:'Unstoppable',        desc:'8 straight weeks of 3+ workouts',   earned:wkStreak3>=8, progress:wkStreak3, goal:8},

    <p class="text-mute text-sm mt-2">${esc(msg)}</p>
    <div class="grid grid-cols-2 gap-3 mt-5">
      <button onclick="closeModal()" class="rounded-xl py-3 chip font-semibold btn-press">Cancel</button>
      <button id="confirmYes" class="rounded-xl py-3 font-bold btn-press bg-red-500 text-white">${esc(confirmLabel)}</button>
    </div></div>`);
  $('#confirmYes').onclick=()=>{ onYes&&onYes(); };
}

/* =================================================================
   SETTINGS
   ================================================================= */
function openSettings(){
  modal(`<div class="p-5">
    <div class="flex items-center gap-3 mb-4">
      <div class="w-9">${MONOGRAM(34)}</div>
      <h3 class="font-display font-700 text-xl">Settings</h3>
    </div>

    ${ state.gas
      ? `<div class="rounded-xl chip p-3 mb-3 text-sm"><b class="text-white">Hosted in Google.</b> <span class="text-mute">This app is served from your Apps Script and syncs to your Sheet automatically — no URL needed.</span></div>`
      : `<label class="text-xs font-bold tracking-widest text-mute">GOOGLE APPS SCRIPT URL</label>
         <input id="setUrl" value="${esc(state.apiUrl)}" placeholder="https://script.google.com/macros/s/.../exec" class="field w-full p-3 text-sm mt-1.5 mb-1"/>
         <p class="text-[11px] text-mute mb-3">Paste your deployed Web App URL to sync with Google Sheets. Leave blank to use this device only.</p>` }

    <label class="text-xs font-bold tracking-widest text-mute">UNITS</label>
    <div class="grid grid-cols-2 gap-2 mt-1.5 mb-4">
      <button onclick="setUnit('kg')" id="unitKg" class="rounded-xl py-3 font-display font-700 btn-press ${state.unit==='kg'?'text-ink':'chip text-mute'}" style="${state.unit==='kg'?'background:var(--volt)':''}">KG</button>
      <button onclick="setUnit('lbs')" id="unitLbs" class="rounded-xl py-3 font-display font-700 btn-press ${state.unit==='lbs'?'text-ink':'chip text-mute'}" style="${state.unit==='lbs'?'background:var(--volt)':''}">LBS</button>
    </div>

    <div class="flex items-center justify-between text-xs text-mute mb-4">
      <span>Status</span>
      <span>${ state.gas ? '<b class="text-white">Connected (hosted)</b>' : (state.apiUrl ? (state.online?'<b class="text-white">Connected</b>':'<b class="edge-text">Not reachable</b>') : '<b>Device-only</b>') }</span>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <button onclick="closeModal()" class="rounded-xl py-3 chip font-semibold btn-press">Close</button>
      <button onclick="saveSettings()" class="rounded-xl py-3 font-bold text-ink btn-press" style="background:var(--volt)">Save & Sync</button>
    </div>
    <button onclick="reloadFromCloud()" class="w-full text-center text-xs text-mute mt-3 btn-press py-1">↻ Reload from cloud</button>
  </div>`);
}
function setUnit(u){
  state.unit=u; Store.set(KEY.unit,u); cacheSave();
  const kg=$('#unitKg'), lbs=$('#unitLbs');
  if(kg){ kg.className=`rounded-xl py-3 font-display font-700 btn-press ${u==='kg'?'text-ink':'chip text-mute'}`; kg.style.background=u==='kg'?'var(--volt)':''; }
  if(lbs){ lbs.className=`rounded-xl py-3 font-display font-700 btn-press ${u==='lbs'?'text-ink':'chip text-mute'}`; lbs.style.background=u==='lbs'?'var(--volt)':''; }
  // persist the preference only — never reloads, so it can't touch your days/workouts
  if(state.apiUrl||state.gas) apiPost('saveSettings',{settings:{unit:u}}).catch(()=>{});
}
async function saveSettings(){
  const el=$('#setUrl');
  if(el){ state.apiUrl=el.value.trim(); Store.set(KEY.url,state.apiUrl); }
  cacheSave();
  closeModal(); toast('Settings saved'); render();
  if(state.apiUrl || state.gas){
    try{ await apiPost('saveSettings',{ settings:{ unit:state.unit } }); }catch(e){}
    reloadFromCloud(true);
  }
}
async function reloadFromCloud(silent){
  if(!state.apiUrl && !state.gas){ if(!silent) toast('No URL set','err'); return; }
  try{
    const data=await apiGet();
    applyCloud(data);
    render(); if(!silent) toast('Synced');
  }catch(e){ state.online=false; if(!silent) toast('Could not reach cloud','err'); render(); }
}

/* ---------- go ---------- */
boot();
</script>
</body>
</html>
